async function buildCertPdf(){
  if (!allLocked()) return;
  if (!window.jspdf || !window.jspdf.jsPDF){ toast('PDF 도구를 불러오지 못했습니다'); return; }
  if (!S.downloads){ toast('이 화면에서는 파일을 받을 수 없습니다'); return; }
  const list = certFilter(certAll());
  if (!list.length){ toast('조건에 맞는 상장이 없습니다'); return; }
  const st = $('#certStatus'); const btns = document.querySelectorAll('[data-cert]'); btns.forEach(b => b.disabled = true);
  try {
    /* 직인 이미지가 없으면(Supabase Storage에 아직 안 올림) 직인 없이 출력 */
    const bg = await loadCertSeal().catch(() => { toast('직인 이미지를 찾지 못해 직인 없이 출력합니다'); return null; });
    if (document.fonts && document.fonts.load){ const txt = list.map(c => [c.t.work, c.name, c.t.dept, c.t.advisor, c.t.company, certTitle(c.award)].join('')).join('') + '제호상장작품명성학과참여업체:()교수0123456789-위학생은년도캡스톤디자인경진대회에서기와같은으로우수한적을거두었므로이수여합니다월일명지전문총';
      try { await Promise.all(['400','700','800'].map(w => document.fonts.load(`${w} 40px ${certFamily()}`, txt))); } catch(e){} }
    const canvas = document.createElement('canvas'); canvas.width = CERT_W; canvas.height = CERT_H; const ctx = canvas.getContext('2d');
    const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4', compress:true});
    for (let k = 0; k < list.length; k++){
      if (st) st.textContent = `만드는 중 ${k+1} / ${list.length}`;
      drawCert(ctx, bg, list[k]);
      if (k) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297);
      await new Promise(r => setTimeout(r, 0));
    }
    if (st) st.textContent = `${list.length}장 완성`;
    const tag = list.length === certAll().length ? '전체' : `${list.length}장`;
    await S.downloads.save({ filename: `${evYear()}_캡스톤디자인_상장_${tag}.pdf`, data: new Blob([pdf.output('arraybuffer')]) });
    toast(`상장 ${list.length}장을 저장했습니다`);
  } catch(e){ if (!(e && e.code === 'declined')) toast(e && e.message === 'bg' ? '상장 배경 이미지를 불러오지 못했습니다' : '상장 PDF를 만들지 못했습니다'); }
  finally { btns.forEach(b => b.disabled = !allLocked()); }
}
async function exportCertMerge(){
  if (!window.XLSX || !S.downloads){ toast('이 화면에서는 파일을 받을 수 없습니다'); return; }

  list.forEach(c => rows.push([c.no, certTitle(c.award), c.t.work||'', certPerson(c), c.t.dept||'', c.t.advisor||'', c.t.company||'', c.t.booth, teamLabel(c.t), c.t.division]));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), '상장');

  catch(e){ if (!(e && e.code === 'declined')) toast('파일을 저장하지 못했습니다'); }
}

function bindCert(){

      <div id="lockOut"></div></section>` : ''}
    <section class="panel section"><h2>심사위원 · 본인 인증</h2>
      <p style="margin:0;color:var(--muted)">위원은 <b>성명과 전화번호</b>를 입력해야 심사 화면에 들어갈 수 있습니다. 전화번호는 저장하지 않고 확인용 암호값(해시)만 저장하므로, 등록 후에는 번호가 화면에 다시 보이지 않습니다. 바꾸려면 새 번호를 넣고 저장하세요. 성명을 바꾸면 위원도 바뀐 성명으로 인증해야 합니다.</p>
      <div class="tablebox"><table><thead><tr><th>학부</th><th>성명</th><th>소속</th><th>전화번호 (인증용)</th><th>상태</th></tr></thead><tbody>
      ${js.map((j,i)=>`<tr><td>${esc(j.division)}</td><td><input type="text" id="jn${i}" value="${esc(j.name)}" aria-label="${esc(j.division)} 위원 이름"></td><td><input type="text" id="jo${i}" value="${esc(j.org||'')}" aria-label="${esc(j.division)} 위원 소속"></td>
        <td><input type="text" id="jp${i}" inputmode="tel" autocomplete="off" placeholder="${j.phoneHash?'새 번호 입력 시 변경':'010-0000-0000'}" aria-label="${esc(j.name)} 위원 전화번호"></td>
        <td>${j.phoneHash?'<span class="chip ok">등록됨</span>':'<span class="chip bad">미등록</span>'}</td></tr>`).join('')}
      </tbody></table></div>
      <div><button class="btn primary" id="saveJudges" type="button">심사위원 저장</button></div></section>
    <section class="panel section"><h2>부스 명단 한꺼번에 입력</h2>
      <p style="margin:0;color:var(--muted)">엑셀에서 <b>부스번호 · 팀명 · 작품명</b> 세 열을 복사해 붙여 넣으세요. 한 줄에 한 팀, 탭이나 쉼표로 구분합니다.</p>
      <textarea id="bulk" rows="5" placeholder="01	공대생	승강기 침수 감지, 제어 시스템"></textarea>
      <div><button class="btn primary" id="applyBulk" type="button">명단 반영</button></div></section>
    <section class="panel section"><h2>부스별 팀 정보</h2>
      <div class="tablebox"><table><thead><tr><th>부스</th><th>학부</th><th>학과</th><th>팀명</th><th>작품명</th><th>참여업체 (상장)</th><th>팀원 (상장, 쉼표로 구분)</th></tr></thead><tbody>
      ${Object.values(S.teams).sort((a,b)=>a.booth.localeCompare(b.booth)).map(t=>`<tr><td class="num">${esc(t.booth)}</td><td>${esc(t.division)}</td><td>${esc(t.dept)}</td>
        <td><input type="text" id="tt${esc(t.booth)}" data-b="${esc(t.booth)}" data-f="team" value="${esc(t.team)}" aria-label="부스 ${esc(t.booth)} 팀명"></td>
        <td><input type="text" id="tw${esc(t.booth)}" data-b="${esc(t.booth)}" data-f="work" value="${esc(t.work)}" aria-label="부스 ${esc(t.booth)} 작품명"></td>
        <td><input type="text" id="tc${esc(t.booth)}" data-b="${esc(t.booth)}" data-f="company" value="${esc(t.company||'')}" aria-label="부스 ${esc(t.booth)} 참여업체"></td>
        <td><input type="text" id="tm${esc(t.booth)}" data-b="${esc(t.booth)}" data-f="memberNames" value="${esc((t.memberNames||[]).join(', '))}" style="min-width:240px" aria-label="부스 ${esc(t.booth)} 팀원"></td></tr>`).join('')}
      </tbody></table></div><p style="margin:0;color:var(--muted);font-size:13px">칸에서 나가면 자동 저장됩니다.</p></section>`;
    /* 마감: 학부별(lockedDivs) · 전체(locked). 모두 두 번 눌러 확정 */
  const missOf = divs => divs.reduce((m, div) => m + judges().filter(j=>j.division===div).reduce((a,j)=>a+teamsOf(div).filter(t=>!scoreOf(j.id,t.booth)).length,0), 0);
  const arm = (btn, text, msg) => { if (btn.dataset.armed){ return true; } btn.dataset.armed = '1'; btn.textContent = text; toast(msg); setTimeout(() => { if (btn.isConnected){ delete btn.dataset.armed; render(); } }, 5000); return false; };
  app.querySelectorAll('[data-divlock]').forEach(btn => btn.onclick = async () => {
    const div = DIVS[+btn.dataset.divlock]; if (S.config.locked) return;
    const on = lockedDivs().includes(div);
    if (!on){ const miss = missOf([div]);
      if (!arm(btn, miss ? `미제출 ${miss}장 · 그래도 마감` : `${div} 마감 확인`, miss ? `${div}에 아직 제출되지 않은 심사표가 ${miss}장 있습니다. 미제출 팀은 수상에서 빠집니다. 그래도 마감하려면 한 번 더 누르세요` : `한 번 더 누르면 ${div}을(를) 마감합니다`)) return; }
    else if (!arm(btn, '해제 확인', `한 번 더 누르면 ${div} 마감을 해제합니다`)) return;
    const next = on ? lockedDivs().filter(d => d !== div) : [...new Set([...lockedDivs(), div])];
    try { await S.db.doc('config/main').update({lockedDivs: next}); toast(on ? `${div} 마감을 해제했습니다` : `${div}을(를) 마감했습니다`); } catch(e){ toast('바꾸지 못했습니다'); }
  });
  $('#lock').onclick = async () => { const btn = $('#lock'); const release = S.config.locked || allLocked();
    if (!release){ const miss = missOf(DIVS.filter(d => !divLocked(d)));
      if (!arm(btn, miss ? `미제출 ${miss}장 · 그래도 전체 마감` : '전체 마감 확인', miss ? `아직 제출되지 않은 심사표가 ${miss}장 있습니다. 미제출 팀은 수상에서 빠집니다. 그래도 마감하려면 한 번 더 누르세요` : '한 번 더 누르면 모든 학부를 마감합니다')) return; }
    else if (!arm(btn, '전체 해제 확인', '한 번 더 누르면 모든 학부의 마감을 해제합니다')) return;
    try { await S.db.doc('config/main').update(release ? {locked: false, lockedDivs: []} : {locked: true}); toast(release ? '모든 학부의 마감을 해제했습니다' : '전체 심사를 마감했습니다'); } catch(e){ toast('바꾸지 못했습니다'); } };
  const readQuota = () => { const quota = {}; DIVS.forEach((div,di) => { quota[div] = {}; ALL_AWARDS.forEach((a,ai) => { quota[div][a] = Math.max(0, parseInt($('#q'+di+'_'+ai).value,10) || 0); }); }); return quota; };
  const checkQuota = () => {
    const quota = readQuota(); const manual = DIVS.some(d => quota[d]['대상'] > 0); let bad = 0; let tops = 0;
    DIVS.forEach((div,di) => { const q = quota[div]; const n = teamsOf(div).length; tops += q['대상'];
      const s = (manual ? ALL_AWARDS : AWARDS).reduce((t,a)=>t+q[a],0);
      $('#qsum'+di).textContent = s;
      $('#qchk'+di).innerHTML = s===n ? '<span class="chip ok">맞음</span>' : `<span class="chip bad">${s>n?'+':''}${s-n}팀</span>`;
      if (s!==n) bad++; });
    const m = $('#qmode'); m.textContent = manual ? '지정 모드' : '자동 모드'; m.className = 'chip ' + (manual ? 'ok' : 'todo');
    $('#qtotal').innerHTML = tops > 1 ? `<span class="chip bad">대상은 전체 1팀만 지정할 수 있습니다 (현재 ${tops})</span>` : manual ? '대상 1팀 지정' : '대상은 전체 1위 1팀 자동';
    $('#saveQuota').disabled = tops > 1 || bad > 0;
    if (bad > 0 && tops <= 1) $('#qtotal').innerHTML += ` · <span class="chip bad">정원 합이 참가팀 수와 다른 학부 ${bad}곳 · 맞춰야 저장됩니다</span>`;
    return {quota, bad, tops};
  };
  app.querySelectorAll('[data-qdiv]').forEach(inp => inp.addEventListener('input', checkQuota));
  checkQuota();
  if (window.SB && $('#posterUp')) {
    if (!SB.posterUrls) SB.loadPosters().then(() => { if (S.view === 'setup' && !document.activeElement.closest('input,textarea,select')) render(); });
    $('#posterUp').onclick = async () => {
      const files = [...($('#posterFiles').files || [])]; const st = $('#posterStatus');
      if (!files.length) { toast('올릴 이미지를 고르세요'); return; }
      const plan = files.map(f => { const m = f.name.match(/(\d{1,3})/); const n = m ? parseInt(m[1], 10) : NaN; return { f, n, key: n >= 1 ? String(n).padStart(2,'0') + '.jpg' : null }; });
      const bad = plan.filter(x => !x.key || !/jpe?g$/i.test(x.f.name) || x.f.size > 5 * 1024 * 1024);
      if (bad.length) { toast('번호가 없거나 JPG가 아니거나 5MB를 넘는 파일: ' + bad.map(x => x.f.name).slice(0, 5).join(', ')); return; }
      const btn = $('#posterUp'); btn.disabled = true; let ok = 0, fail = 0;
      for (const x of plan) { st.textContent = `올리는 중 ${ok + fail + 1}/${plan.length} · ${x.key}`;
        try { await SB.uploadPoster(x.f, x.key); ok++; } catch (e) { fail++; console.error(e); toast(x.f.name + ' 실패: ' + (e.message || e)); } }
      btn.disabled = false; st.textContent = `완료: ${ok}장 저장${fail ? ', ' + fail + '장 실패' : ''}`; toast(`작품설명 이미지 ${ok}장 저장${fail ? ', ' + fail + '장 실패' : ''}`);
      await SB.loadPosters(true); render();
    };
  }
  if (window.SB && $('#lockCheck')) {
    const showLocks = async () => { const out = $('#lockOut'); out.innerHTML = '<p style="color:var(--muted)">확인 중…</p>';
      let rows; try { rows = await SB.loginLocks(); } catch(e){ out.innerHTML = `<p style="color:var(--bad)">${esc(e.message)}</p>`; return; }
      out.innerHTML = `<div class="tablebox"><table><thead><tr><th>학부</th><th>평가위원</th><th class="n">최근 10분 실패</th><th class="n">기기 수</th><th>상태</th><th>해제</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${esc(r.division||'')}</td><td>${esc(r.name)}</td><td class="n">${r.fails}</td><td class="n">${r.devices}</td>
          <td>${r.locked ? '<span class="chip bad">전체 잠김</span>' : r.device_locked ? '<span class="chip warn">일부 기기 잠김</span>' : '<span class="chip ok">정상</span>'}</td>
          <td><button class="btn" type="button" data-unlock="${esc(r.judge_id)}" ${r.fails ? '' : 'disabled'}>잠금 해제</button></td></tr>`).join('')}</tbody></table></div>`;
      out.querySelectorAll('[data-unlock]').forEach(b => b.onclick = async () => { b.disabled = true;
        try { const n = await SB.unlockJudge(b.dataset.unlock); toast(`잠금을 해제했습니다 (실패 기록 ${n}건 삭제)`); } catch(e){ toast('해제하지 못했습니다: ' + e.message); }
        showLocks(); }); };
    $('#lockCheck').onclick = showLocks;
  }
  $('#saveEvent').onclick = async () => {
    const y = parseInt($('#evYear').value, 10), dt = $('#evDate').value;
    if (!(y >= 2020 && y <= 2100) || !/^\d{4}-\d{2}-\d{2}$/.test(dt)){ toast('학년도와 시상일을 확인하세요'); return; }
    try { await S.db.doc('config/main').update({year: y, awardDate: dt}); toast(`${y}학년도 · 시상일 ${dt}로 저장했습니다`); } catch(e){ toast('저장하지 못했습니다' + (e && e.message ? ': ' + e.message : '')); }
  };
  $('#saveQuota').onclick = async () => {
    const {quota, bad, tops} = checkQuota();
    if (tops > 1){ toast('대상은 전체 1팀만 지정할 수 있습니다'); return; }
    if (bad > 0){ toast(`정원 합이 참가팀 수와 다른 학부가 ${bad}곳 있어 저장하지 않았습니다`); return; }
    try { await S.db.doc('config/main').update({quota}); toast('수상 정원을 저장했습니다. 수상(안)이 다시 배정됩니다'); } catch(e){ toast('저장하지 못했습니다'); }
  };
  /* 위원별 점수 초기화: 첫 클릭은 확인 대기(5초), 두 번째 클릭에 삭제 */
  app.querySelectorAll('[data-reset]').forEach(btn => { let armT = null; const label = btn.textContent;
    btn.onclick = async () => {
      if (btn.dataset.reset === '*' ? DIVS.some(divLocked) : divLocked((judge(btn.dataset.reset)||{}).division)){ toast('마감된 학부의 점수는 초기화할 수 없습니다'); return; }
      const jid = btn.dataset.reset; const keys = Object.keys(S.scores).filter(k => jid === '*' || k.startsWith(jid + '__'));
      if (!keys.length){ toast('지울 점수가 없습니다'); return; }
      const who = jid === '*' ? '전체 위원' : (judge(jid) ? judge(jid).name + ' 위원' : jid);
      if (!armT){ btn.textContent = `${who} ${keys.length}건 삭제 확인`; btn.classList.add('primary'); armT = setTimeout(() => { armT = null; btn.textContent = label; btn.classList.remove('primary'); }, 5000); return; }
      clearTimeout(armT); armT = null;
      app.querySelectorAll('[data-reset]').forEach(b => b.disabled = true);
      const st = $('#resetStatus'); let ok = 0, fail = 0;
      for (const k of keys){ try { await S.db.doc('scores/' + k).delete(); delete S.scores[k]; ok++; } catch(e){ fail++; } if (st) st.textContent = `지우는 중 ${ok + fail} / ${keys.length}`; }
      toast(fail ? `${who} 점수 ${ok}건을 지웠고 ${fail}건은 지우지 못했습니다` : `${who} 점수 ${ok}건을 초기화했습니다`);
      render();
    };
  });
  $('#saveJudges').onclick = async () => {
    const next = []; let bad = 0, setN = 0;
    for (let i = 0; i < js.length; i++){
      const j = js[i]; const o = {...j, name:$('#jn'+i).value.trim()||j.name, org:$('#jo'+i).value.trim()};
      const raw = $('#jp'+i).value.trim();
      if (raw){ const ph = phoneDigits(raw); if (ph.length < 10 || ph.length > 11){ bad++; } else { if (window.SB) o.phoneNew = ph; else o.phoneHash = await authHash(o.id, ph); setN++; } }
      next.push(o);
    }
    if (bad){ toast(`전화번호 형식이 맞지 않는 칸이 ${bad}개 있습니다 (숫자 10~11자리)`); return; }
    try { await S.db.doc('config/main').update({judges: next}); toast(setN ? `심사위원을 저장했습니다 · 전화번호 ${setN}명 등록` : '심사위원을 저장했습니다'); } catch(e){ toast('저장하지 못했습니다'); }
  };
  app.querySelectorAll('input[data-b]').forEach(inp => inp.addEventListener('change', async () => {
    try { const v = inp.dataset.f === 'memberNames' ? inp.value.split(/[,，、]/).map(x=>x.trim()).filter(Boolean) : inp.value.trim(); await S.db.doc('teams/'+inp.dataset.b).update({[inp.dataset.f]: v}); toast('부스 '+inp.dataset.b+' 저장'); } catch(e){ toast('저장하지 못했습니다'); }
  }));
  $('#applyBulk').onclick = async () => {
    const lines = $('#bulk').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    let ok=0, skip=0;
    for (const l of lines){
      const p = l.split(/\t|,/).map(x=>x.trim());
      const b = String(p[0]||'').replace(/\D/g,'').padStart(2,'0');
      if (!S.teams[b]){ skip++; continue; }
      try { await S.db.doc('teams/'+b).update({team:p[1]||'', work:p.slice(2).join(', ')}); ok++; } catch(e){ skip++; }
    }
    toast(`${ok}팀 반영${skip?`, ${skip}줄 건너뜀`:''}`);
    if (ok) $('#bulk').value='';
  };
}

/* ---------- boot ---------- */
S.judgeId = store.get('judgeId');
setView();
(async () => {
  if (!window.claude || !window.claude.use){ S.failed = true; return render(); }
  let db = null, user = null, dl = null;
  try { [db, user, dl] = await Promise.all([claude.use('db'), claude.use('user').catch(()=>null), claude.use('downloads').catch(()=>null)]); } catch(e){ db = null; }
  S.db = db; S.user = user; S.downloads = dl;
  if (!db){ S.failed = true; return render(); }
  try { S.canEdit = user ? await user.canEdit() : false; S.uid = user ? await user.id() : null; } catch(e){}
  if (window.SB && SB.mode === 'judge' && SB.judgeId){ S.judgeId = SB.judgeId; store.set('judgeId', SB.judgeId); }
  document.querySelectorAll('#tabs a[data-view="results"],#tabs a[data-view="setup"]').forEach(a => a.hidden = !S.canEdit);
  /* 관리자: 어느 화면에서나 상단에서 로그아웃 */
  const ao = $('#adminOut');
  if (ao && window.SB && S.canEdit){ ao.hidden = false; ao.title = (SB.email || '') + ' 로그아웃'; ao.onclick = e => { e.preventDefault(); store.set('judgeId', null); SB.logout(); }; }
  /* 구독이 끊기면 안내 (점수 입력 중이면 화면은 그대로 두고 알림만) */
  const onErr = (e) => { const why = window.SB && e && e.message ? ' (' + String(e.message).slice(0, 120) + ')' : ''; if (!(S.loaded.config && S.loaded.teams)){ S.failed = true; render(); } else toast('저장소 연결이 끊겼습니다. 페이지를 새로 고친 뒤 제출 여부를 확인하세요' + why); };
  db.doc('config/main').onSnapshot(s => { S.config = s.exists ? s.data() : {judges:[],locked:false}; S.loaded.config = true; setView(); }, onErr);
  db.collection('teams').onSnapshot(q => { const m={}; q.docs.forEach(d => { m[d.id] = {booth:d.id, team:'', work:'', ...d.data()}; }); S.teams=m; S.loaded.teams=true; if (S.view!=='setup' || !document.activeElement || document.activeElement.tagName!=='INPUT') render(); }, onErr);
  db.collection('scores').onSnapshot(q => { const m={}; const bad=[];
    /* 형식 검사: 항목 10개, 각 5~10 정수. 합계는 항목으로 다시 계산. 이상 문서는 집계에서 빼고 집계 화면에 표시 */
    q.docs.forEach(d => { const v = d.data() || {}; const it = Array.isArray(v.items) ? v.items.map(Number) : [];
      if (it.length === 10 && it.every(x => Number.isInteger(x) && x >= 5 && x <= 10) && /^[^_]+__\d{2}$/.test(d.id)) m[d.id] = {...v, items: it, total: sumItems(it)}; else bad.push(d.id); });
    S.badScores = bad; S.scores=m; S.loaded.scores=true; const typing = document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName); if (!S.booth && (S.view!=='setup' || !typing)) render(); }, onErr);
})();
</script>
