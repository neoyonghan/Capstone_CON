<title>캡스톤디자인 온라인 평가시스템</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&family=Song+Myung&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky top bar with three views (심사 입력 · 집계 · 설정); the score sheet mirrors the paper form's 4 areas x 10 items */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --sunk:#E9EDF4; --line:#D5DCE7;
  --fg:#152036; --muted:#5B6782; --navy:#0B2A5B; --accent:#1E5BD8; --accent-ink:#FFFFFF;
  --t10:#0B6E4F; --t10bg:#DDF3EA; --t9:#1E5BD8; --t9bg:#E2EBFC; --t7:#8A5A00; --t7bg:#FBEFD6;
  --ok:#0B6E4F; --okbg:#DDF3EA; --warn:#9A4B00; --warnbg:#FDEBD5; --bad:#B42318; --badbg:#FDE4E1;
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1422; --surface:#151E30; --sunk:#1C2740; --line:#2A3752;
  --fg:#E6ECF7; --muted:#9AA8C2; --navy:#9DB8F0; --accent:#5B8DEF; --accent-ink:#0D1422;
  --t10:#5BD1A4; --t10bg:#123528; --t9:#8DB0FF; --t9bg:#1A2B52; --t7:#F2BE5C; --t7bg:#3A2C10;
  --ok:#5BD1A4; --okbg:#123528; --warn:#F2BE5C; --warnbg:#3A2C10; --bad:#FF8A7E; --badbg:#3E1A17;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1422; --surface:#151E30; --sunk:#1C2740; --line:#2A3752;
  --fg:#E6ECF7; --muted:#9AA8C2; --navy:#9DB8F0; --accent:#5B8DEF; --accent-ink:#0D1422;
  --t10:#5BD1A4; --t10bg:#123528; --t9:#8DB0FF; --t9bg:#1A2B52; --t7:#F2BE5C; --t7bg:#3A2C10;
  --ok:#5BD1A4; --okbg:#123528; --warn:#F2BE5C; --warnbg:#3A2C10; --bad:#FF8A7E; --badbg:#3E1A17;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.04em}
.brand b{font-size:17px;color:var(--navy);text-wrap:balance}
nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs a{padding:8px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
nav.tabs a[aria-current="page"]{background:var(--navy);color:var(--surface)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:24px 64px}
h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
h2{font-size:17px;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 20px;max-width:65ch}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.btn{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 16px;border-radius:8px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.todo{background:var(--sunk);color:var(--muted)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.banner{padding:12px 16px;border-radius:var(--r);background:var(--warnbg);color:var(--warn);font-weight:600;margin-bottom:16px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
/* judge picker */
.divgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.divcard{padding:16px;display:flex;flex-direction:column;gap:10px}
.divcard h3{margin:0;font-size:14px;color:var(--muted);font-weight:600}
.judgebtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left}
.judgebtn span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
/* team list */
.progress{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;flex:1 1 160px;min-width:120px}
.progress i{display:block;height:100%;background:var(--ok)}
.teamlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:16px}
.team{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 14px;text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer}
.team:hover{border-color:var(--accent)}
.team .booth{font-family:var(--mono);font-weight:600;font-size:13px;background:var(--sunk);border-radius:6px;padding:4px 7px;grid-row:span 2}
.team .t1{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .t2{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:2}
.team .score{grid-row:1/span 2;grid-column:3;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.team .score b{font-family:var(--mono);font-size:18px}
/* sheet */
.sheet-head{padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;border-bottom:1px solid var(--line)}
.sheet-head dt{color:var(--muted);font-size:13px}
.sheet-head dd{margin:0;font-weight:600;min-width:0}
.area{border-bottom:1px solid var(--line)}
.area-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 18px 4px;font-weight:700;color:var(--navy)}
.area-h .num{color:var(--fg)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:8px 18px}
.item p{margin:0;font-size:14px}
.item p small{display:block;color:var(--muted);font-size:12px}
.scale{display:flex;gap:4px;flex-wrap:wrap}
.scale fieldset{border:0;margin:0;padding:0;display:flex;gap:3px}
.scale legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pt{position:relative}
.pt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pt span{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:8px;font-family:var(--mono);font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.pt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.pt.t10 input:checked+span{background:var(--t10bg);color:var(--t10);border-color:var(--t10)}
.pt.t9 input:checked+span{background:var(--t9bg);color:var(--t9);border-color:var(--t9)}
.pt.t7 input:checked+span{background:var(--t7bg);color:var(--t7);border-color:var(--t7)}
.scale .gap{width:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:10px 18px;border-bottom:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.sheet-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;border-radius:0 0 var(--r) var(--r)}
.total{display:flex;align-items:baseline;gap:6px}
.total b{font-family:var(--mono);font-size:28px;color:var(--navy)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{width:18px;height:18px;margin-top:2px}
textarea,input[type=text],input[type=email],input[type=password],select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.memo{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.memo label{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
/* tables */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.rank1 td{background:var(--t10bg)}
.divblock{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--muted);font-size:14px}
.stats b{color:var(--fg)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.section{padding:18px;display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
td input[type=text]{min-width:140px;padding:6px 8px}
@media (max-width:560px){
  .item{grid-template-columns:1fr}
  .pt span{width:36px;height:38px}
  .sheet-head{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hero{margin:0 0 26px;border-radius:16px;overflow:hidden;background:#0b2a6b;box-shadow:0 6px 24px rgba(10,30,80,.18)}
.hero img{display:block;width:100%;height:auto}
@media (max-width:600px){.hero{border-radius:10px;margin-bottom:18px}}
.sheet-top{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.sheet-top .sheet-head{flex:1;border-bottom:0}
.poster{flex:none;width:168px;margin:12px 14px 12px 0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sunk);cursor:zoom-in;position:relative;align-self:flex-start;aspect-ratio:1715/2200}
.poster img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.poster .zoomhint{position:absolute;right:6px;bottom:6px;background:rgba(11,42,91,.86);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
.poster.missing{display:none}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(6,12,24,.92);display:flex;flex-direction:column}
.lightbox .lb-bar{display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-left,0px));padding-top:max(10px,env(safe-area-inset-top,0px));color:#fff}
.lightbox .lb-bar b{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lightbox .lb-bar button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;min-height:40px}
.lightbox .lb-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
.lightbox .lb-scroll img{display:block;margin:0 auto;height:100%;width:auto;max-width:none;cursor:zoom-in}
.lightbox.zoomed .lb-scroll img{height:auto;cursor:zoom-out}
@media (max-width:560px){.sheet-top{flex-direction:column-reverse}.poster{width:auto;margin:12px 16px 0;aspect-ratio:auto;max-height:220px}.poster img{height:220px}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><small id="brandYear">명지전문대학 · 2026학년도</small><b>캡스톤디자인 경진대회 평가시스템</b></div>
    <nav class="tabs" id="tabs" aria-label="화면">
      <a href="#judge" data-view="judge">심사 입력</a>
      <a href="#results" data-view="results" hidden>집계</a>
      <a href="#setup" data-view="setup" hidden>설정</a>

    </nav>

</header>

  <div class="empty">심사 명단을 불러오는 중입니다…</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.79.0/dist/umd/supabase.js"></script>
<script>
/* ===== Supabase 연결 설정 (여기 두 값만 바꾸면 됩니다) =====
   ─ 대시보드 Project Settings → API 의 값 두 개를 넣으세요.
   anon public key 는 웹에 공개돼도 되는 키입니다(표는 보안 규칙으로 막혀 있음).
   service_role key 는 절대 넣지 마세요. */
window.SB_CONFIG = {
  url: 'https://xrwsjvwwjmlkytrtbdoh.supabase.co',
  anonKey: 'sb_publishable_OxYgDNwo0uj2LROPkwrf2w_GZJhAOqx'
};
</script>
<script>
/* =====================================================================
   Supabase 어댑터
   claude.ai 평가시스템이 쓰던 window.claude.use('db'|'user'|'downloads')와
   같은 모양을 Supabase 위에 만들어, 화면 코드는 거의 그대로 쓴다.

   모드
   - anon  : 로그인 전. 데이터 없음(로그인 화면만)
   - judge : 위원 로그인(성명+전화번호 → 세션 토큰). RPC로 자기 학부 팀·자기 점수만 읽고 씀
   - admin : Supabase Auth 관리자 계정. 표 전체 읽기, 설정·초기화·대리 입력

   실시간 대신 4초마다 다시 읽고, 바뀐 부분만 화면에 알린다.
   ===================================================================== */
(function () {
  'use strict';
  const cfg = window.SB_CONFIG || {};
  const configured = !!(cfg.url && cfg.anonKey && !/YOUR_/.test(cfg.url + cfg.anonKey) && window.supabase);
  const client = configured ? window.supabase.createClient(cfg.url, cfg.anonKey) : null;
  const POLL_MS = cfg.pollMs || 4000;

  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  };
  const pad = b => String(b).padStart(2, '0');
  const AWARD = { grand: '대상', gold: '금상', silver: '은상', bronze: '동상', merit: '장려상' };

  const SB = window.SB = {
    configured, client, mode: 'anon', isAdmin: false, uid: null, email: null,
    token: LS.get('sbJudgeToken'), judgeId: null, lastError: null,
    posterUrls: null, posterBusy: false, posterAt: 0,
    /* 로그인한 위원·관리자만: team-posters 버킷의 파일 목록을 읽어 6시간짜리 임시 주소를 한 번에 발급 */
    async loadPosters(force) {
      if (!configured || SB.posterBusy || SB.mode === 'anon') return;
      if (!force && SB.posterAt && Date.now() - SB.posterAt < 60 * 1000) return;
      SB.posterBusy = true; SB.posterAt = Date.now();
      try {
        const ls = await client.storage.from('team-posters').list('', { limit: 1000 });
        if (ls.error) throw ls.error;
        const names = (ls.data || []).map(f => f.name).filter(n => /^\d{2,3}\.jpe?g$/i.test(n));
        const urls = {};
        if (names.length) {
          const r = await client.storage.from('team-posters').createSignedUrls(names, 60 * 60 * 6);
          if (r.error) throw r.error;
          (r.data || []).forEach(x => { if (x.signedUrl && !x.error) urls[(x.path || '').replace(/\.jpeg$/i, '.jpg').toLowerCase()] = x.signedUrl; });
        }
        SB.posterUrls = urls; SB.posterCount = Object.keys(urls).length;
        clearTimeout(SB.posterTimer); SB.posterTimer = setTimeout(() => SB.loadPosters(true), 5 * 60 * 60 * 1000);
        window.dispatchEvent(new Event('sb-posters'));
      } catch (e) { console.warn('posters', e); SB.posterUrls = SB.posterUrls || null; }
      finally { SB.posterBusy = false; }
    },
    /* 점수 수정 이력(score_history: 바뀌기 전 값) */
    async fetchHistory(booth) {
      const { data, error } = await client.from('score_history').select('judge_id,booth,items,absent,memo,rev,changed_at,changed_by,action')
        .eq('booth', Number(booth)).order('changed_at');
      if (error) throw new Error(error.message);
      return data || [];
    },
    async historyBooths() {
      const { data, error } = await client.from('score_history').select('booth').limit(5000);
      if (error) throw new Error(error.message);
      const c = {}; (data || []).forEach(r => { const b = String(r.booth).padStart(2, '0'); c[b] = (c[b] || 0) + 1; }); return c;
    },
    /* 로그인 잠금 확인·해제 (관리자) */
    async loginLocks() {
      const { data, error } = await client.rpc('admin_login_locks');
      if (error) throw new Error(/admin_login_locks|function/.test(error.message || '') ? 'Supabase에 패치 5(patch_5_improve.sql)를 먼저 실행하세요' : error.message);
      return data || [];
    },
    async unlockJudge(id) {
      const { data, error } = await client.rpc('admin_unlock_judge', { p_judge: id });
      if (error) throw new Error(error.message);
      return data;
    },
    async uploadPoster(file, key) {
      const r = await client.storage.from('team-posters').upload(key, file, { upsert: true, contentType: 'image/jpeg', cacheControl: '3600' });
      if (r.error) throw r.error;
    }
  };

  /* ---------- 상태와 구독 ---------- */
  let state = { config: { judges: [], locked: false, quota: {}, slotMin: 10 }, teams: {}, scores: {} };
  const last = { config: '', teams: '', scores: '' };
  const subs = { config: [], teams: [], scores: [] };
  const clone = v => v == null ? undefined : JSON.parse(JSON.stringify(v));
  const docSnap = (id, data) => ({ id, exists: data != null, data: () => clone(data) });
  const colSnap = m => ({ docs: Object.keys(m).sort().map(k => docSnap(k, m[k])) });
  function emit(force) {
    const parts = { config: state.config, teams: state.teams, scores: state.scores };
    for (const k of Object.keys(parts)) {
      const s = JSON.stringify(parts[k]);
      if (!force && s === last[k]) continue;
      last[k] = s;
      subs[k].forEach(f => { try { f.cb(k === 'config' ? docSnap('main', parts[k]) : colSnap(parts[k])); } catch (e) { console.error(e); } });
    }
  }
  function fail(e) {
    SB.lastError = e;
    for (const k of Object.keys(subs)) subs[k].forEach(f => { if (f.err) try { f.err(e); } catch (x) {} });
  }

  /* ---------- 읽기 ---------- */
  async function rows(q) { const { data, error } = await q; if (error) throw error; return data || []; }

  async function fetchAdmin() {
    const [js, qs, st, ts, ms, sc] = await Promise.all([
      rows(client.from('judges').select('id,division,name,org,title,phone_hash,active').order('id')),
      rows(client.from('award_quota').select('*')),
      rows(client.from('settings').select('*')),
      rows(client.from('teams').select('*').order('booth')),
      rows(client.from('team_members').select('booth,seq,name').order('booth').order('seq')),
      rows(client.from('scores').select('*'))
    ]);
    const quota = {};
    qs.forEach(q => { quota[q.division] = {}; for (const k in AWARD) quota[q.division][AWARD[k]] = q[k]; });
    const s0 = st[0] || {};
    const config = {
      judges: js.filter(j => j.active !== false).map(j => ({ id: j.id, division: j.division, name: j.name, org: j.org || '', title: j.title || '', phoneHash: j.phone_hash ? 'set' : null })),
      locked: !!s0.locked, lockedDivs: s0.locked_divs || [], slotMin: s0.slot_min || 10, quota,
      ...(s0.event_year ? { year: s0.event_year, awardDate: s0.award_date } : evCfg())
    };
    const members = {};
    ms.forEach(m => (members[m.booth] = members[m.booth] || []).push(m.name));
    const teams = {}, divOf = {};
    ts.forEach(t => {
      const b = pad(t.booth); divOf[t.booth] = t.division;
      teams[b] = { booth: b, division: t.division, dept: t.dept, advisor: t.advisor || '', team: t.team_name, work: t.work_title,
                   company: t.company || '', memberNames: members[t.booth] || [], members: (members[t.booth] || []).length };
    });
    const scores = {};
    sc.forEach(s => {
      scores[s.judge_id + '__' + pad(s.booth)] = { judgeId: s.judge_id, booth: pad(s.booth), division: divOf[s.booth], items: s.items,
        total: s.total, absent: s.absent, memo: s.memo || '', updatedAt: s.updated_at, rev: s.rev, by: s.updated_by };
    });
    return { config, teams, scores };
  }

  /* 행사 정보(학년도·시상일): 로그인 전 화면에서도 제목에 쓰도록 공개 함수로 읽음 */
  let EVENT = null;
  async function loadEvent() {
    try { const r = await client.rpc('event_info'); if (!r.error && r.data) EVENT = r.data; } catch (e) {}
  }
  const evCfg = () => EVENT ? { year: EVENT.year, awardDate: EVENT.award_date } : {};

  async function fetchJudge() {
    const { data, error } = await client.rpc('judge_sheet', { p_token: SB.token });
    if (error) {
      if (/로그인이 만료|invalid input syntax for type uuid/.test(error.message || '')) { SB.token = null; LS.set('sbJudgeToken', null); location.reload(); }
      throw error;
    }
    const j = data.judge;
    SB.judgeId = j.id;
    const config = { judges: [{ id: j.id, division: j.division, name: j.name, org: j.org || '', title: j.title || '', phoneHash: 'set' }],
                     locked: !!data.locked, slotMin: data.slot_min || 10, quota: {}, ...evCfg() };
    const teams = {}, scores = {};
    (data.teams || []).forEach(t => {
      const b = pad(t.booth);
      teams[b] = { booth: b, division: t.division || j.division, dept: t.dept, advisor: t.advisor || '', team: t.team_name, work: t.work_title, company: t.company || '' };
      if (t.score) scores[j.id + '__' + b] = { judgeId: j.id, booth: b, division: j.division, items: t.score.items, total: t.score.total,
        absent: t.score.absent, memo: t.score.memo || '', updatedAt: t.score.updated_at, rev: t.score.rev, by: t.score.updated_by };
    });
    return { config, teams, scores };
  }

  let fetching = null, fails = 0;
  async function refresh() {
    if (SB.mode === 'anon') { emit(); return; }
    if (fetching) return fetching;
    fetching = (async () => {
      try { state = SB.mode === 'admin' ? await fetchAdmin() : await fetchJudge(); fails = 0; emit(); }
      catch (e) { console.error(e); if (++fails === 3) fail(e); throw e; }
      finally { fetching = null; }
    })();
    return fetching;
  }
  const refreshSoon = () => setTimeout(() => refresh().catch(() => {}), 0);

  /* ---------- 쓰기 ---------- */
  function rpcErr(error) { const e = new Error((error && (error.message || error.hint)) || '저장하지 못했습니다'); e.code = error && error.code; return e; }

  async function setScore(id, body) {
    const [jid, b] = id.split('__');
    const args = { p_booth: Number(b), p_items: body.items.map(Number), p_absent: !!body.absent, p_memo: body.memo || '', p_base_rev: Number(body.baseRev) || 0 };
    const { error } = SB.mode === 'admin'
      ? await client.rpc('admin_submit_score', { p_judge: jid, ...args })
      : await client.rpc('submit_score', { p_token: SB.token, ...args });
    if (error) throw rpcErr(error);
    refreshSoon();
  }

  async function updateConfig(patch) {
    if (SB.mode !== 'admin') throw new Error('관리자만 할 수 있습니다');
    if ('locked' in patch || 'lockedDivs' in patch) {
      const up = { updated_at: new Date().toISOString() };
      if ('locked' in patch) up.locked = !!patch.locked;
      if ('lockedDivs' in patch) up.locked_divs = patch.lockedDivs || [];
      const { error } = await client.from('settings').update(up).eq('id', true);
      if (error) throw rpcErr(error);
    }
    if ('year' in patch || 'awardDate' in patch) {
      const up = { updated_at: new Date().toISOString() };
      if ('year' in patch) up.event_year = Number(patch.year);
      if ('awardDate' in patch) up.award_date = patch.awardDate;
      const { error } = await client.from('settings').update(up).eq('id', true);
      if (error) throw rpcErr(/column/.test(error.message || '') ? { message: 'Supabase에 패치 5(patch_5_improve.sql)를 먼저 실행하세요' } : error);
      await loadEvent();
    }
    if (patch.quota) {
      const rowsQ = Object.entries(patch.quota).map(([division, q]) => ({ division, grand: q['대상'] || 0, gold: q['금상'] || 0, silver: q['은상'] || 0, bronze: q['동상'] || 0, merit: q['장려상'] || 0 }));
      const { error } = await client.from('award_quota').upsert(rowsQ, { onConflict: 'division' });
      if (error) throw rpcErr(error);
    }
    if (patch.judges) {
      for (const j of patch.judges) {
        const { error } = await client.from('judges').update({ name: j.name, org: j.org || null, title: j.title || null }).eq('id', j.id);
        if (error) throw rpcErr(error);
        if (j.phoneNew) {
          const r = await client.rpc('admin_set_phone', { p_judge: j.id, p_phone: String(j.phoneNew) });
          if (r.error) throw rpcErr(r.error);
        }
      }
    }
    refreshSoon();
  }

  async function updateTeam(b, patch) {
    if (SB.mode !== 'admin') throw new Error('관리자만 할 수 있습니다');
    const booth = Number(b), up = {};
    if ('team' in patch) up.team_name = patch.team;
    if ('work' in patch) up.work_title = patch.work;
    if ('company' in patch) up.company = patch.company || null;
    if ('dept' in patch) up.dept = patch.dept;
    if ('advisor' in patch) up.advisor = patch.advisor || null;
    if (Object.keys(up).length) {
      const { error } = await client.from('teams').update(up).eq('booth', booth);
      if (error) throw rpcErr(error);
    }
    if (Array.isArray(patch.memberNames)) {
      const old = await rows(client.from('team_members').select('name,is_leader,note').eq('booth', booth));
      const keep = {}; old.forEach(m => keep[m.name] = m);
      let r = await client.from('team_members').delete().eq('booth', booth);
      if (r.error) throw rpcErr(r.error);
      const ins = patch.memberNames.map((name, i) => ({ booth, seq: i + 1, name, is_leader: !!(keep[name] && keep[name].is_leader), note: keep[name] ? keep[name].note : null }));
      if (ins.length) { r = await client.from('team_members').insert(ins); if (r.error) throw rpcErr(r.error); }
    }
    refreshSoon();
  }

  async function deleteScore(id) {
    if (SB.mode !== 'admin') throw new Error('관리자만 할 수 있습니다');
    const [jid, b] = id.split('__');
    const { error } = await client.from('scores').delete().eq('judge_id', jid).eq('booth', Number(b));
    if (error) throw rpcErr(error);
    delete state.scores[id];
    refreshSoon();
  }

  /* ---------- window.claude 와 같은 모양 ---------- */
  const db = {
    doc(path) {
      const [col, id] = path.split('/');
      return {
        onSnapshot(cb, err) { if (col === 'config') { subs.config.push({ cb, err }); setTimeout(() => cb(docSnap('main', state.config))); } return () => {}; },
        async get() {
          await refresh();
          const m = col === 'config' ? { main: state.config } : state[col] || {};
          return docSnap(id, m[id]);
        },
        async set(body) { if (col === 'scores') return setScore(id, body); throw new Error('지원하지 않는 저장입니다: ' + path); },
        async update(patch) {
          if (col === 'config') return updateConfig(patch);
          if (col === 'teams') return updateTeam(id, patch);
          throw new Error('지원하지 않는 저장입니다: ' + path);
        },
        async delete() { if (col === 'scores') return deleteScore(id); throw new Error('지원하지 않는 삭제입니다: ' + path); }
      };
    },
    collection(col) {
      return { onSnapshot(cb, err) { (subs[col] = subs[col] || []).push({ cb, err }); setTimeout(() => cb(colSnap(state[col] || {}))); return () => {}; } };
    }
  };
  const user = {
    async canEdit() { return SB.isAdmin; },
    async isOwner() { return SB.isAdmin; },
    async id() { return SB.uid || (SB.judgeId ? 'judge:' + SB.judgeId : null); }
  };
  const downloads = {
    async save({ filename, data }) {
      const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
      const a = document.createElement('a'); a.href = url; a.download = filename || 'download';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
  };

  /* ---------- 로그인·로그아웃 ---------- */
  SB.judgeLogin = async (name, phone) => {
    /* 기기 번호: 잠금을 기기별로 걸어, 다른 사람이 틀린 번호를 넣어도 이 기기는 잠기지 않게 함 */
    let dev = LS.get('sbDevice'); if (!dev) { dev = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); LS.set('sbDevice', dev); }
    let { data, error } = await client.rpc('judge_login', { p_name: name, p_phone: phone, p_device: dev });
    if (error && /judge_login|function|schema cache/i.test(error.message || '') && !/잠/.test(error.message || ''))
      ({ data, error } = await client.rpc('judge_login', { p_name: name, p_phone: phone }));   /* 패치 5 적용 전 */
    if (error) return { ok: false, error: error.message || '로그인하지 못했습니다' };
    if (data && data.ok === false) return data;
    if (!data || !data.token) return { ok: false, error: '로그인하지 못했습니다' };
    LS.set('sbJudgeToken', data.token);
    return { ok: true, ...data };
  };
  SB.adminLogin = async (email, password) => {
    const { error } = await client.auth.signInWithPassword({ email, password });
    if (error) return { ok: false, error: '이메일 또는 비밀번호가 맞지 않습니다' };
    const r = await client.rpc('is_admin');
    if (r.error || r.data !== true) { await client.auth.signOut(); return { ok: false, error: '관리자로 지정되지 않은 계정입니다' }; }
    LS.set('sbJudgeToken', null);
    return { ok: true };
  };
  SB.logout = async () => {
    try {
      if (SB.mode === 'judge' && SB.token) await client.rpc('judge_logout', { p_token: SB.token });
      if (SB.mode === 'admin') await client.auth.signOut();
    } catch (e) {}
    LS.set('sbJudgeToken', null);
    location.reload();
  };

  /* ---------- 시작 ---------- */
  SB.ready = (async () => {
    if (!configured) return;
    try {
      const { data: { session } } = await client.auth.getSession();
      if (session) {
        const r = await client.rpc('is_admin');
        if (!r.error && r.data === true) { SB.mode = 'admin'; SB.isAdmin = true; SB.uid = session.user.id; SB.email = session.user.email; }
      }
      if (SB.mode === 'anon' && SB.token) SB.mode = 'judge';
      await loadEvent(); state.config = { ...state.config, ...evCfg() };
      await refresh().catch(() => {});
      if (SB.mode === 'admin') {
        const s = await client.storage.from('private-assets').createSignedUrl('cert-seal.png', 60 * 60 * 6);
        if (!s.error && s.data) window.CERT_SEAL_URL = s.data.signedUrl;
      }
    } catch (e) { console.error(e); SB.lastError = e; }
    setInterval(() => { if (!document.hidden) refresh().catch(() => {}); }, POLL_MS);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh().catch(() => {}); });
  })();

  window.claude = {
    async use(name) {
      if (!configured) return null;
      await SB.ready;
      return name === 'db' ? db : name === 'user' ? user : name === 'downloads' ? downloads : null;
    }
  };
})();
</script>
<script>
const DIVS = ['스마트시스템공학부','AI·SW융합학부','경영·휴먼라이프학부','예술·건강학부'];
const AREAS = [
  {name:'창의성 및 기획성', max:30, items:['아이디어의 창의성(독창성) 및 진보성','기능성 및 미적감각을 융합·반영 내용의 우수성','과제 수행 프로세스의 체계성']},
  {name:'기술성 및 완성도', max:20, items:['기초설계과정의 논리적 타당성 및 실현가능성','결과물 제작 및 조립·작동의 완성도']},
  {name:'발표 및 팀협력', max:30, items:['학생 현장발표 및 질의응답','보고서 구성 및 작성의 충실도','팀의 협력정도 및 참여도']},
  {name:'기대효과', max:20, items:['출품과제의 전시효과','결과물의 제품화 가능성']},
];
const ITEMS = AREAS.flatMap(a => a.items);
const TIERS = [{label:'매우우수',cls:'t10',pts:[10]},{label:'우수',cls:'t9',pts:[9,8]},{label:'보통',cls:'t7',pts:[7,6,5]}];

const S = { db:null, user:null, downloads:null, canEdit:false, uid:null,
  config:null, teams:{}, scores:{}, loaded:{config:false,teams:false,scores:false},
  view:'judge', judgeId:null, booth:null, draft:null, failed:false };

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} } };
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

function judges(){ return (S.config && Array.isArray(S.config.judges)) ? S.config.judges : []; }
function judge(id){ return judges().find(j => j.id === id); }
function teamsOf(div){ return Object.values(S.teams).filter(t => t.division === div).sort((a,b)=>a.booth.localeCompare(b.booth)); }
function scoreKey(jid, booth){ return jid + '__' + booth; }
function scoreOf(jid, booth){ return S.scores[scoreKey(jid, booth)]; }
function teamLabel(t){ return t.team || ('부스 ' + t.booth); }
/* 행사 정보: 설정에서 바꾸는 학년도·시상일 (기본 2026학년도, 11월 20일) */
function evYear(){ const y = parseInt((S.config || {}).year, 10); return y >= 2000 && y <= 2100 ? y : 2026; }
function evAwardDate(){ const v = (S.config || {}).awardDate; return /^\d{4}-\d{2}-\d{2}$/.test(v || '') ? v : evYear() + '-11-20'; }
function awardDateKo(){ const [y, m, d] = evAwardDate().split('-').map(Number); return `${y}년 ${m}월 ${d}일`; }
/* 작품설명 이미지: Supabase Storage 비공개 버킷 team-posters/01.jpg … 80.jpg 의 임시 주소(6시간)를 한 번에 받아 씀 */
function posterSrc(t){ const n = parseInt(String(t && t.booth || '').replace(/\D/g,''), 10); if (!(n >= 1 && n <= 999)) return '';
  const key = String(n).padStart(2,'0') + '.jpg';
  if (window.SB && SB.posterUrls) return SB.posterUrls[key] || '';
  if (window.SB) { SB.loadPosters && SB.loadPosters(); return ''; }
  return 'posters/' + key; }
function posterThumb(t){ const src = posterSrc(t); if (!src) return '';
  return `<button type="button" class="poster" data-poster="${esc(src)}" data-ptitle="${esc((t.booth||'') + '. ' + (t.work||'') + ' · ' + teamLabel(t))}" aria-label="작품 설명 이미지 크게 보기"><img src="${esc(src)}" alt="${esc(t.work||'')} 작품 설명" loading="lazy" decoding="async" onerror="this.parentNode.classList.add('missing')"><span class="zoomhint">크게 보기</span></button>`; }
function openPoster(src, title){
  closePoster();
  const lb = document.createElement('div'); lb.className = 'lightbox'; lb.id = 'lightbox'; lb.setAttribute('role','dialog'); lb.setAttribute('aria-modal','true');
  lb.innerHTML = `<div class="lb-bar"><b></b><button type="button" data-lb="zoom">확대</button><button type="button" data-lb="close">닫기 ✕</button></div><div class="lb-scroll"><img alt=""></div>`;
  lb.querySelector('b').textContent = title || '작품 설명';
  const img = lb.querySelector('img'); img.src = src; img.alt = (title || '') + ' 작품 설명';
  const toggle = (ev) => { const sc = lb.querySelector('.lb-scroll'); const z = !lb.classList.contains('zoomed');
    const r = img.getBoundingClientRect(); const fx = ev && ev.clientX != null ? (ev.clientX - r.left) / r.width : .5; const fy = ev && ev.clientY != null ? (ev.clientY - r.top) / r.height : 0;
    lb.classList.toggle('zoomed', z); lb.querySelector('[data-lb=zoom]').textContent = z ? '화면 맞춤' : '확대';
    if (z) requestAnimationFrame(() => { sc.scrollLeft = Math.max(0, img.offsetWidth * fx - sc.clientWidth / 2); sc.scrollTop = Math.max(0, img.offsetHeight * fy - sc.clientHeight / 2); }); };
  img.addEventListener('click', toggle);
  lb.addEventListener('click', (e) => { const b = e.target.closest('[data-lb]'); if (!b) { if (e.target.classList.contains('lb-scroll')) closePoster(); return; }
    if (b.dataset.lb === 'close') closePoster(); else toggle(); });
  document.body.appendChild(lb); document.body.style.overflow = 'hidden'; lb.querySelector('[data-lb=close]').focus();
}
function closePoster(){ const lb = document.getElementById('lightbox'); if (lb) { lb.remove(); document.body.style.overflow = ''; } }
document.addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('[data-poster]'); if (b) { e.preventDefault(); openPoster(b.dataset.poster, b.dataset.ptitle); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePoster(); });
window.addEventListener('sb-posters', () => { const box = document.querySelector('.sheet-top'); const t = S.booth && S.teams[S.booth];
  if (box && t && !box.querySelector('.poster')) box.insertAdjacentHTML('beforeend', posterThumb(t)); });
/* 발표 예정 시각(제안): 학부별 부스 순서, 10:00 시작, 팀당 발표 5분 + 질의 3분 + 이동 2분, 12:00~13:00 점심 */
function slotOf(t){
  const cfg = S.config || {}; const step = Number(cfg.slotMin) || 10;
  const i = teamsOf(t.division).findIndex(x => x.booth === t.booth); if (i < 0) return '';
  let m = 600 + i * step; if (m >= 720) m += 60;
  return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
}
function sumItems(items){ return items.reduce((a,b)=>a+(Number(b)||0),0); }

/* ---------- views ---------- */
function setView(){
  const h = (location.hash || '#judge').slice(1);
  S.view = ['judge','results','setup'].includes(h) ? h : 'judge';
  if ((S.view==='results' || S.view==='setup') && !S.canEdit) S.view='judge';
  document.querySelectorAll('#tabs a').forEach(a => {
    if (a.dataset.view===S.view) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
  render();
}
window.addEventListener('hashchange', setView);

function render(){
  const app = $('#app');
  { const by = document.getElementById('brandYear'); if (by && S.config) by.textContent = '명지전문대학 · ' + evYear() + '학년도'; }
  if (S.failed){ app.innerHTML = '<div class="empty">' + (window.SB && !SB.configured
      ? '저장소 설정이 비어 있습니다. config.js에 Supabase 주소(url)와 anon key를 넣어 주세요.'
      : '심사 저장소에 연결할 수 없습니다. 인터넷 연결을 확인하고 새로 고침해 주세요.') + '</div>'; return; }
  if (!(S.loaded.config && S.loaded.teams && S.loaded.scores)){ app.innerHTML = '<div class="empty">' + (S.loaded.config && S.loaded.teams ? '제출된 점수를 불러오는 중입니다…' : '심사 명단을 불러오는 중입니다…') + '</div>'; return; }
  if (S.view==='results') return renderResults(app);
  if (S.view==='setup') return renderSetup(app);
  renderJudge(app);
}

/* ---------- judge view ---------- */
function renderJudge(app){
  let locked = !!(S.config && S.config.locked);
  /* Supabase: 로그인 전에는 명단을 받지 않으므로 바로 로그인 화면 */
  if (window.SB && SB.mode === 'anon') return renderPicker(app);
  if (!judges().length || !Object.keys(S.teams).length){
    app.innerHTML = '<div class="panel empty">심사위원과 부스 명단이 아직 등록되지 않았습니다.' + (S.canEdit ? ' <a href="#setup">설정</a>에서 등록하세요.' : ' 운영본부에 문의하세요.') + '</div>';
    return;
  }
  const j = judge(S.judgeId);
  if (!j || !authed(j)) return renderPicker(app);
  locked = divLocked(j.division);   /* 학부별 또는 전체 마감 */
  if (S.booth && S.teams[S.booth]) return renderSheet(app, j, S.teams[S.booth], locked);
  const list = teamsOf(j.division);
  const done = list.filter(t => scoreOf(j.id, t.booth)).length;
  app.innerHTML = `
    ${locked ? '<div class="banner">심사가 마감되어 점수를 고칠 수 없습니다. 입력한 점수만 확인할 수 있습니다.</div>' : ''}
    <div class="row">
      <div class="grow"><h1>${esc(j.name)} 위원</h1><p class="lead" style="margin:0">${esc(j.division)} · ${esc(j.org || '')}</p></div>
      ${S.adminAs===j.id?'<span class="chip warn">관리자 보기</span>':''}<button class="btn ghost" id="switchJudge" type="button">로그아웃</button>
    </div>
    ${S.canEdit ? `<div class="panel row" style="margin-top:14px;padding:10px 14px;gap:10px"><label for="judgeSwitch" style="font-weight:600;white-space:nowrap">심사위원 변경 <small style="color:var(--muted);font-weight:400">(관리자)</small></label>
      <select id="judgeSwitch" class="grow" style="max-width:420px">${DIVS.map(d => `<optgroup label="${esc(d)}">${judges().filter(x=>x.division===d).map(x => { const n = teamsOf(d).filter(t=>scoreOf(x.id,t.booth)).length; return `<option value="${esc(x.id)}" ${x.id===j.id?'selected':''}>${esc(x.name)} · ${n}/${teamsOf(d).length}팀 제출</option>`; }).join('')}</optgroup>`).join('')}</select></div>` : ''}
    <div class="row" style="margin-top:16px">
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${list.length}" aria-valuenow="${done}" aria-label="심사 진행"><i style="width:${list.length? (done/list.length*100):0}%"></i></div>
      <span class="num"><b>${done}</b> / ${list.length}팀 완료</span>
    </div>
    <div class="teamlist">
      ${list.map(t => { const s = scoreOf(j.id, t.booth); return `
        <button type="button" class="panel team" data-booth="${esc(t.booth)}">
          <span class="booth">${esc(t.booth)}</span>
          <span class="t1">${esc(teamLabel(t))}</span>
          <span class="t2"><span class="num">${slotOf(t)}</span> · ${esc(t.work || t.dept)}</span>
          <span class="score">${s ? (s.absent ? '<span class="chip warn">미참여</span>' : `<b>${s.total}</b><span class="chip ok">제출</span>`) : '<span class="chip todo">미입력</span>'}</span>
        </button>`; }).join('')}
    </div>`;
  if ($('#judgeSwitch')) $('#judgeSwitch').onchange = e => { const id = e.target.value; if (!judge(id) || id === j.id) return;
    /* 관리자 전환: 이 기기의 위원 로그인은 풀고 관리자 보기로 연다 */
    S.judgeId = id; S.adminAs = id; S.booth = null; store.set('judgeId', null); store.set('judgeAuth', null);
    toast(`${judge(id).name} 위원 자료를 관리자 보기로 엽니다`); render(); window.scrollTo(0,0); };
  $('#switchJudge').onclick = () => {
    if (window.SB && !S.canEdit){ store.set('judgeId',null); SB.logout(); return; }  /* 위원: 서버 세션 종료 */
    S.judgeId=null; S.adminAs=null; store.set('judgeId',null); store.set('judgeAuth',null); render(); };
  app.querySelectorAll('.team').forEach(b => b.onclick = () => openSheet(b.dataset.booth));
}

/* ---------- 위원 본인 인증: 성명 + 전화번호 ----------
   전화번호는 저장하지 않고 SHA-256(고정 문자열|위원ID|숫자만) 값만 config에 저장해 대조한다.
   기기에는 인증값을 기억해 두고, 관리자가 번호를 다시 등록하면 기존 기기 인증은 풀린다. */
function phoneDigits(v){ return String(v||'').replace(/\D/g,''); }
function normName(v){ return String(v||'').replace(/\s+/g,''); }
async function authHash(jid, digits){
  const data = new TextEncoder().encode('mjc-capstone-2026|' + jid + '|' + digits);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
function authed(j){
  if (!j) return false;
  if (S.canEdit && S.adminAs === j.id) return true;
  /* Supabase: 서버가 발급한 위원 세션 토큰으로 판단 */
  if (window.SB) return SB.mode === 'judge' && SB.judgeId === j.id;
  return !!j.phoneHash && store.get('judgeAuth') === j.phoneHash;
}

function renderPicker(app){
  /* 실시간 갱신으로 다시 그려져도 입력 중인 성명·전화번호와 커서 위치를 유지 */
  const keep = { n: ($('#lgName')||{}).value || '', p: ($('#lgPhone')||{}).value || '', f: document.activeElement && document.activeElement.id };
  renderPickerInner(app);
  if ($('#lgName') && !$('#lgName').disabled){ $('#lgName').value = keep.n; $('#lgPhone').value = keep.p; if (keep.f === 'lgName' || keep.f === 'lgPhone') $('#'+keep.f).focus(); }
}
function renderPickerInner(app){
  const lockedOut = Date.now() < AUTH.until;
  app.innerHTML = `
    <figure class="hero"><img src="${HERO_SRC}" alt="CAPSTONE DESIGN FAIR — “My Idea, at Myongji!” · 산학AI융합지원센터 캡스톤디자인 경진대회" width="1376" height="768"></figure>
    <h1>평가위원 로그인</h1>
    <p class="lead">성명과 전화번호를 입력하세요. 인증되면 담당 학부의 부스 목록이 열리고, 이 기기에서는 로그아웃할 때까지 로그인이 유지됩니다.</p>
    <form class="panel section" id="login" autocomplete="off" style="max-width:440px">
      <div class="field"><label for="lgName">성명</label><input type="text" id="lgName" autocomplete="off" placeholder="예: 홍길동" ${lockedOut?'disabled':''}></div>
      <div class="field"><label for="lgPhone">전화번호</label><input type="text" id="lgPhone" inputmode="tel" autocomplete="off" placeholder="010-0000-0000" ${lockedOut?'disabled':''}></div>
      <p id="lgMsg" role="alert" style="margin:0;color:var(--bad);font-size:14px;min-height:1.4em">${lockedOut?'입력이 여러 번 틀려 잠시 잠겼습니다. 1분 뒤 다시 시도하세요.':''}</p>
      <button class="btn primary" id="lgGo" type="submit" style="min-height:48px" ${lockedOut?'disabled':''}>로그인</button>
    </form>
    ${window.SB && !S.canEdit ? `<details class="panel section" style="max-width:440px;margin-top:22px"><summary style="cursor:pointer;font-weight:600">관리자 로그인</summary>
      <form id="adLogin" autocomplete="on" style="display:grid;gap:12px;margin-top:12px">
        <div class="field"><label for="adEmail">이메일</label><input type="email" id="adEmail" autocomplete="username"></div>
        <div class="field"><label for="adPw">비밀번호</label><input type="password" id="adPw" autocomplete="current-password"></div>
        <p id="adMsg" role="alert" style="margin:0;color:var(--bad);font-size:14px;min-height:1.2em"></p>
        <button class="btn primary" id="adGo" type="submit">관리자 로그인</button>
      </form></details>` : ''}
    ${window.SB && S.canEdit ? `<p style="margin-top:18px;color:var(--muted);font-size:14px">관리자 ${esc(SB.email||'')}로 로그인됨 · <a href="#" id="adOut">관리자 로그아웃</a></p>` : ''}
    ${S.canEdit ? `<section class="divblock" style="margin-top:28px"><h2>관리자: 심사위원 변경</h2>
      <p style="margin:0;color:var(--muted);font-size:14px">관리자 계정에서만 보입니다. 인증 없이 위원 화면을 열며, 이 창을 닫으면 풀립니다.</p>
      <div class="divgrid">
      ${DIVS.map(d => `<div class="panel divcard"><h3>${esc(d)} · ${teamsOf(d).length}팀</h3>
        ${judges().filter(j=>j.division===d).map(j => { const n = teamsOf(d).filter(t=>scoreOf(j.id,t.booth)).length;
          return `<button type="button" class="btn judgebtn" data-j="${esc(j.id)}"><span>${esc(j.name)}<small style="color:var(--muted);font-weight:400"> · ${esc(j.org||'')}</small>${j.phoneHash?'':' <span class="chip bad">번호 미등록</span>'}</span><span class="chip ${n===teamsOf(d).length&&n?'ok':'todo'} num">${n}/${teamsOf(d).length}</span></button>`; }).join('') || '<span style="color:var(--muted)">배정된 위원 없음</span>'}
      </div>`).join('')}
      </div></section>` : ''}`;
  if (lockedOut) setTimeout(() => { if (!S.judgeId) render(); }, AUTH.until - Date.now() + 50);
  app.querySelectorAll('[data-j]').forEach(b => b.onclick = () => { S.judgeId=b.dataset.j; S.adminAs=b.dataset.j; store.set('judgeId',null); store.set('judgeAuth',null); render(); window.scrollTo(0,0); });
  if ($('#adLogin')) $('#adLogin').addEventListener('submit', async e => {
    e.preventDefault(); const m = $('#adMsg'); $('#adGo').disabled = true;
    const r = await SB.adminLogin($('#adEmail').value.trim(), $('#adPw').value);
    if (!r.ok){ $('#adGo').disabled = false; m.textContent = r.error; return; }
    location.reload();
  });
  if ($('#adOut')) $('#adOut').onclick = e => { e.preventDefault(); SB.logout(); };
  $('#login').addEventListener('submit', async e => {
    e.preventDefault(); const msg = $('#lgMsg');
    if (Date.now() < AUTH.until) return;
    const name = normName($('#lgName').value), ph = phoneDigits($('#lgPhone').value);
    if (!name || ph.length < 10){ msg.textContent = '성명과 전화번호(숫자 10~11자리)를 모두 입력하세요.'; return; }
    if (window.SB){
      $('#lgGo').disabled = true; $('#lgGo').textContent = '확인 중…';
      const r = await SB.judgeLogin(name, ph);
      if (!r.ok){ $('#lgGo').disabled = false; $('#lgGo').textContent = '로그인'; msg.textContent = r.error || '로그인하지 못했습니다.'; return; }
      store.set('judgeId', r.judge_id); location.reload(); return;
    }
    if (!(window.crypto && crypto.subtle)){ msg.textContent = '이 브라우저에서는 인증을 처리할 수 없습니다. 운영본부에 문의하세요.'; return; }
    const cands = judges().filter(j => normName(j.name) === name);
    let hit = null;
    for (const j of cands){ if (j.phoneHash && await authHash(j.id, ph) === j.phoneHash){ hit = j; break; } }
    if (!hit){
      AUTH.fails++;
      if (AUTH.fails >= 5){ AUTH.fails = 0; AUTH.until = Date.now() + 60000; return render(); }
      msg.textContent = cands.length && !cands.some(j => j.phoneHash) ? '전화번호가 아직 등록되지 않았습니다. 운영본부에 문의하세요.' : `성명 또는 전화번호가 맞지 않습니다. (${AUTH.fails}/5)`;
      return;
    }
    AUTH.fails = 0; S.judgeId = hit.id; S.adminAs = null; store.set('judgeId', hit.id); store.set('judgeAuth', hit.phoneHash);
    toast(`${hit.name} 위원으로 로그인했습니다`); render(); window.scrollTo(0,0);
  });
}

function openSheet(booth){
  S.booth = booth;
  const s = scoreOf(S.judgeId, booth);
  /* baseAt: 이 화면을 연 시점의 저장본. 저장 직전에 다른 기기가 먼저 저장했는지 확인하는 데 씀 */
  S.draft = s ? {items:[...s.items], absent:!!s.absent, memo:s.memo||'', confirm:false, baseAt:s.updatedAt||null, baseRev:s.rev||null, force:false}
              : {items:Array(10).fill(null), absent:false, memo:'', confirm:false, baseAt:null, baseRev:null, force:false};
  S.draftRestored = false; restoreDraft();
  render(); window.scrollTo(0,0);
}

/* 작성 중 점수: 제출 전까지 이 기기에 임시 저장(새로 고침·화면 꺼짐·뒤로 가기 대비).
   다시 열 때 서버 저장본이 그사이 바뀌지 않았으면 이어서 쓰고, 바뀌었으면 버림 */
function draftKey(jid, booth){ return 'draft:' + (jid || S.judgeId) + ':' + (booth || S.booth); }
function sheetDirty(){
  const d = S.draft; if (!d || !S.booth) return false;
  const s = scoreOf(S.judgeId, S.booth);
  const base = s ? {items:s.items||[], absent:!!s.absent, memo:s.memo||''} : {items:Array(10).fill(null), absent:false, memo:''};
  const n = v => v == null ? null : Number(v);
  return !!d.absent !== base.absent || (d.memo||'') !== base.memo || d.items.some((v,i) => n(v) !== n(base.items[i]));
}
function saveDraft(){
  const d = S.draft; if (!d || !S.booth || !S.judgeId) return;
  if (!sheetDirty()){ store.set(draftKey(), null); return; }
  store.set(draftKey(), JSON.stringify({items:d.items, absent:!!d.absent, memo:d.memo||'', baseAt:d.baseAt, baseRev:d.baseRev, at:Date.now()}));
}
function clearDraft(jid, booth){ store.set(draftKey(jid, booth), null); }
function hasDraft(jid, booth){ return !!store.get(draftKey(jid, booth)); }
function restoreDraft(){
  let x = null; try { x = JSON.parse(store.get(draftKey()) || 'null'); } catch(e){ x = null; }
  if (!x) return;
  const j = judge(S.judgeId);
  if ((j && divLocked(j.division)) || x.baseAt !== S.draft.baseAt || x.baseRev !== S.draft.baseRev || Date.now() - (x.at || 0) > 3 * 24 * 3600e3){ store.set(draftKey(), null); return; }
  if (Array.isArray(x.items) && x.items.length === 10) S.draft.items = x.items.map(v => (v >= 5 && v <= 10) ? Number(v) : null);
  S.draft.absent = !!x.absent; S.draft.memo = String(x.memo || '').slice(0, 300);
  S.draftRestored = sheetDirty();
}
window.addEventListener('beforeunload', e => {
  if (S.booth && S.draft && sheetDirty()){ saveDraft(); e.preventDefault(); e.returnValue = ''; }
});

function refreshSheet(){
  const d = S.draft; let idx=0;
  AREAS.forEach((a,ai) => { const sub=d.items.slice(idx, idx+a.items.length); idx+=a.items.length;
    const el=document.querySelector(`[data-sub="${ai}"]`); if (el) el.textContent = sub.every(v=>v!=null)? sumItems(sub) : '–'; });

  $('#save').disabled = !((d.absent || filled===10) && d.confirm) || divLocked((judge(S.judgeId)||{}).division);

async function saveScore(j, t){
  const d = S.draft; const btn = $('#save');
  if (divLocked(j.division)){ toast('이 학부 심사가 마감되어 제출할 수 없습니다'); return render(); }
  if (!authed(judge(j.id))){ toast('로그인이 풀렸습니다. 다시 로그인한 뒤 제출하세요'); S.booth = null; return render(); }
  if (!d.absent && d.items.some(v => !(v >= 5 && v <= 10))){ toast('모든 항목에 점수를 선택하세요'); return; }
  /* 동시 저장 감지: 화면을 연 뒤 다른 기기에서 같은 심사표가 저장됐으면 한 번 더 눌러야 덮어씀 */
  /* 저장 직전에 서버의 최신 문서를 다시 읽어, 화면을 연 뒤 바뀌었는지(rev·updatedAt) 확인 */
  btn.disabled = true; btn.textContent = '확인 중…';
  let cur;
  try { const snap = await S.db.doc('scores/' + scoreKey(j.id, t.booth)).get(); cur = snap.exists ? snap.data() : null; }
  catch(e){ btn.disabled = false; btn.textContent = '다시 제출'; toast('저장소에 연결하지 못했습니다. 연결을 확인하고 다시 제출하세요'); return; }
  btn.disabled = false; btn.textContent = d.force ? '그래도 덮어쓰기' : (scoreOf(j.id, t.booth) ? '수정 제출' : '제출');
  const curAt = cur ? (cur.updatedAt || null) : null; const curRev = cur ? (cur.rev || null) : null;
  if ((curAt !== d.baseAt || curRev !== d.baseRev) && !d.force){
    d.force = true; btn.textContent = '그래도 덮어쓰기';
    toast(cur ? `다른 기기에서 이 심사표가 ${fmtTime(curAt)}에 ${cur.absent ? '미참여로' : sumItems(cur.items||[]) + '점으로'} 먼저 저장됐습니다. 확인 후 한 번 더 누르면 덮어씁니다`
              : '화면을 연 뒤 이 심사표가 초기화(삭제)됐습니다. 확인 후 한 번 더 누르면 새로 저장합니다');
    return;
  }
  btn.disabled = true; btn.textContent = '저장 중…';
  const items = d.absent ? Array(10).fill(ABSENT_SCORE) : d.items.map(Number);
  const body = { judgeId:j.id, judgeName:j.name, booth:t.booth, division:t.division, items, total: sumItems(items), absent:d.absent, memo:(d.memo||'').slice(0,300), updatedAt:new Date().toISOString(), by:S.uid||null,
    rev: Date.now().toString(36) + Math.random().toString(36).slice(2, 10),
    baseRev: cur ? (cur.rev || 0) : 0 };  /* Supabase: 서버가 이 값으로 동시 저장을 한 번 더 검사 */
  try {
    await S.db.doc('scores/' + scoreKey(j.id, t.booth)).set(body);
    S.scores[scoreKey(j.id,t.booth)] = body; clearDraft(j.id, t.booth); S.draftRestored = false;
    toast(`${teamLabel(t)} ${d.absent?'미참여로':body.total+'점으로'} 제출했습니다`);
    const next = teamsOf(j.division).find(x => !scoreOf(j.id, x.booth));
    if (next) openSheet(next.booth); else { S.booth=null; render(); }
  } catch(e){
    btn.disabled=false; btn.textContent='다시 제출';
    toast(e && e.code==='invalid_argument' ? '저장 권한이 없습니다. 운영본부에 문의하세요.' : '저장하지 못했습니다. 연결을 확인하고 다시 제출하세요.');
  }
}

function fmtTime(iso){ try { const d=new Date(iso); return d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); } catch(e){ return ''; } }

/* ---------- results ---------- */
const AWARDS = ['금상','은상','동상','장려상'];
const QUOTA_DEFAULT = {
  '스마트시스템공학부':{금상:1,은상:2,동상:4,장려상:18},
  'AI·SW융합학부':{금상:1,은상:1,동상:3,장려상:18},
  '경영·휴먼라이프학부':{금상:1,은상:0,동상:2,장려상:7},
  '예술·건강학부':{금상:1,은상:1,동상:3,장려상:17}};
const GAP_LIMIT = 15;
/* 마감: 전체 마감(config.locked) 또는 학부별 마감(config.lockedDivs 배열) */
function lockedDivs(){ return (S.config && Array.isArray(S.config.lockedDivs)) ? S.config.lockedDivs : []; }
function divLocked(div){ return !!(S.config && (S.config.locked || lockedDivs().includes(div))); }
function allLocked(){ return !!(S.config && (S.config.locked || DIVS.every(divLocked))); }
function lockLabel(){ if (allLocked()) return '전체 마감'; const n = DIVS.filter(divLocked).length; return n ? `학부 ${n}/${DIVS.length} 마감` : '입력 중'; }
const ABSENT_SCORE = 5; /* 미참여 팀: 전 항목 5점 자동 처리 */
const ALL_AWARDS = ['대상', ...AWARDS];
function quotaOf(div){ const q = (S.config && S.config.quota && S.config.quota[div]) || QUOTA_DEFAULT[div] || {}; return ALL_AWARDS.reduce((o,a)=>(o[a]=Number(q[a])||0,o),{}); }
/* 대상 정원을 학부별로 1 이상 넣으면 '지정 모드': 모든 상격을 학부별 정원대로 배정. 모두 0이면 '자동 모드': 전체 1위가 대상, 그 학부는 한 단계씩 상향 */
function isManualTop(){ return DIVS.some(d => quotaOf(d)['대상'] > 0); }
/* 팀 통계: 평균 합계, 동점 기준용 기술성·완성도 소계 평균(4·5번), 창의성·기획성 소계 평균(1~3번), 위원 간 점수 차 */
function teamStat(t, js){
  const ss = js.map(j => scoreOf(j.id, t.booth)); const got = ss.filter(Boolean);
  if (!got.length) return {t, ss, n:0, avg:null, tech:null, creat:null, gap:null, absent:false};
  const m = f => got.reduce((a,s)=>a+f(s),0)/got.length;
  const totals = got.map(s=>s.total);
  return {t, ss, n:got.length, avg:m(s=>s.total), tech:m(s=>s.items[3]+s.items[4]), creat:m(s=>s.items[0]+s.items[1]+s.items[2]),
    gap: got.length>=2 ? Math.max(...totals)-Math.min(...totals) : null, absent: got.some(s=>s.absent),
    /* 미참여 팀: 제출한 위원 모두가 미참여로 처리한 팀 → 순위·수상에서 제외 */
    out: got.every(s=>s.absent)};
}
const near = (a,b) => Math.abs(a-b) < 1e-9;
/* 순위 비교: 평균 → 기술성 및 완성도 소계 → 창의성 및 기획성 소계 */
function cmpStat(a,b){ return (near(a.avg,b.avg)?0:b.avg-a.avg) || (near(a.tech,b.tech)?0:b.tech-a.tech) || (near(a.creat,b.creat)?0:b.creat-a.creat); }
function sameStat(a,b){ return cmpStat(a,b)===0; }
function tieReason(a,b){ return !near(a.avg,b.avg) ? '' : !near(a.tech,b.tech) ? '평균 동점 → 기술성·완성도로 결정' : !near(a.creat,b.creat) ? '평균·기술성 동점 → 창의성·기획성으로 결정' : '동점 (기준으로 가려지지 않음)'; }
function rowsFor(div){
  const js = judges().filter(j=>j.division===div);
  const rows = teamsOf(div).map(t => teamStat(t, js));
  const scored = rows.filter(r=>r.avg!=null && !r.out);
  rows.forEach(r => { r.rank = (r.avg==null || r.out) ? null : scored.filter(x => cmpStat(x, r) < 0).length + 1;
    const twin = scored.find(x => x!==r && near(x.avg, r.avg)); r.tieNote = twin ? tieReason(r, twin) : ''; });
  return { js, rows };
}
/* 수상(안): 전체 1위 대상, 그 외 학부별 수상 현황 정원대로 금·은·동·장려 */
function computeAwards(){
  const out = {}; const all = [];
  DIVS.forEach(div => rowsFor(div).rows.forEach(r => { if (r.out) out[r.t.booth] = {award:'수상 제외', tie:false, base:null, excluded:true}; else if (r.avg!=null) all.push({...r, div}); }));
  if (!all.length) return out;
  all.sort(cmpStat);
  if (isManualTop()){
    DIVS.forEach(div => {
      const q = quotaOf(div);
      const seq = ALL_AWARDS.flatMap(a => Array(q[a]).fill(a));
      const list = all.filter(x => x.div===div);
      list.forEach((x,i) => { const aw = seq[i] || '정원 초과';
        const tie = (i>0 && sameStat(list[i-1],x) && (seq[i-1]||'정원 초과')!==aw) || (i<list.length-1 && sameStat(list[i+1],x) && (seq[i+1]||'정원 초과')!==aw);
        out[x.t.booth] = {award:aw, tie, base:null, reason: aw==='대상' && list[i+1] ? tieReason(x, list[i+1]) : ''}; });
    });
    return out;
  }
  /* 대상: 전체를 동점자 처리 기준(평균 → 기술성 소계 → 창의성 소계)으로 정렬한 1위 */
  const top = all[0]; out[top.t.booth] = {award:'대상', tie: all.length>1 && sameStat(all[1], top), reason: all[1] ? tieReason(top, all[1]) : ''};
  DIVS.forEach(div => {
    const q = quotaOf(div);
    const seq = AWARDS.flatMap(a => Array(q[a]).fill(a));
    const full = all.filter(x => x.div===div);
    const list = full.filter(x => x !== top);
    if (top.div===div) out[top.t.booth].base = seq[0] || '정원 초과';
    /* 대상 선정 학부: 대상 팀을 빼고 다시 배정하므로 아래 팀들이 상격 순으로 한 단계씩 올라감 */
    list.forEach((x,i) => { const aw = seq[i] || '정원 초과'; const base = seq[full.indexOf(x)] || '정원 초과';
      const tie = (i>0 && sameStat(list[i-1],x) && (seq[i-1]||'정원 초과')!==aw) || (i<list.length-1 && sameStat(list[i+1],x) && (seq[i+1]||'정원 초과')!==aw);
      out[x.t.booth] = {award:aw, tie, base: base!==aw ? base : null}; });
  });
  return out;
}
function fmt1(v){ return v==null ? '–' : (Math.round(v*10)/10).toFixed(1); }

/* 실시간 갱신으로 다시 그릴 때 PDF·상장 선택값이 초기화되지 않도록 보존 */
const KEEP_SEL = '#pdfJudge,#pdfTeam,#certDiv,#certTeam,#certStart,#certPad,#certFont,[data-certaw],[data-certname]';
function keepKey(el){ return el.id || (el.dataset.certaw !== undefined ? 'aw:' + el.value : 'nm:' + el.dataset.certname); }
function renderResults(app){
  const kept = {}; app.querySelectorAll(KEEP_SEL).forEach(el => kept[keepKey(el)] = el.type === 'checkbox' ? el.checked : el.value);
  renderResultsInner(app);
  app.querySelectorAll(KEEP_SEL).forEach(el => { const k = keepKey(el); if (!(k in kept)) return; if (el.type === 'checkbox') el.checked = kept[k]; else if (el.tagName !== 'SELECT' || [...el.options].some(o => o.value === kept[k])) el.value = kept[k]; });
  if (Object.keys(kept).length){ const st = $('#certStatus'); if (st) st.textContent = `선택 ${certFilter(certAll()).length}장 / 전체 ${certAll().length}장`; }
}
function renderResultsInner(app){
  const all = Object.values(S.teams).length * 2;
  const got = Object.keys(S.scores).length;
  const AW = computeAwards();
  const winner = Object.entries(AW).find(([,v])=>v.award==='대상');
  const manual = isManualTop();
  const gaps = DIVS.flatMap(div => rowsFor(div).rows.filter(r => r.gap!=null && r.gap>=GAP_LIMIT));
  app.innerHTML = `
    <div class="row" style="margin-bottom:6px"><div class="grow"><h1>집계</h1>
      <p class="lead" style="margin:0">평균은 제출된 위원 점수로 계산합니다. 평균이 같으면 기술성 및 완성도 소계, 그다음 창의성 및 기획성 소계가 높은 팀이 앞섭니다(대상 포함). 위원 모두가 미참여로 처리한 팀은 순위·수상·상장에서 제외됩니다.</p></div>
      <button class="btn primary" id="xlsx" type="button">엑셀로 받기</button></div>
    <div class="stats" style="margin:12px 0 20px"><span>제출 <b class="num">${got}</b> / ${all}장</span>

/* 위원 간 점수 차 15점 이상: 같은 학부 위원 2명의 총점·영역별 점수 비교 */
function areaSums(items){ let k=0; return AREAS.map(a => { const v = sumItems(items.slice(k,k+a.items.length)); k += a.items.length; return v; }); }
function gapRows(){
  const out = [];
  DIVS.forEach(div => { const {js, rows} = rowsFor(div);
    rows.filter(r => r.gap!=null && r.gap>=GAP_LIMIT).sort((a,b)=>b.gap-a.gap || a.t.booth.localeCompare(b.t.booth)).forEach(r => {
      const [a, b] = r.ss; const sa = areaSums(a.items), sb = areaSums(b.items);
      out.push({div, r, js, a, b, sa, sb, itemDiff: a.items.map((v,i)=>v-b.items[i])});
    }); });
  return out;
}
/* ---------- 점수 수정 이력: 이의 제기 때 언제 어떤 점수로 바뀌었는지 확인 ---------- */
function historySectionHtml(){
  const ts = Object.values(S.teams).sort((a,b) => String(a.booth).localeCompare(String(b.booth)));
  return `<section class="panel section" id="histSec"><h2>점수 수정 이력</h2>
    <p style="margin:0;color:var(--muted)">팀을 고르면 위원별로 처음 제출부터 지금 점수까지 바뀐 순서대로 보여 줍니다. <span id="histHint"></span></p>
    <div class="row"><select id="histTeam" class="grow" style="max-width:520px">${ts.map(t => `<option value="${esc(t.booth)}">${esc(t.booth)} · ${esc(teamLabel(t))} · ${esc(t.work || '')}</option>`).join('')}</select>
      <button class="btn" id="histGo" type="button">이력 보기</button></div>
    <div id="histOut"></div></section>`;
}
async function historyRows(booth){
  const out = []; const tot = (h) => h.absent ? ABSENT_SCORE * 10 : sumItems((h.items || []).map(Number));
  const viaOf = (v, by, jid) => v === 'admin' || /^admin/.test(String(by || '')) ? '관리자 대리' : (v === 'judge' || (by && by === jid) ? '위원' : '');
  if (window.SB && SB.fetchHistory){
    (await SB.fetchHistory(booth)).forEach(h => { const j = judge(h.judge_id);
      out.push({ judge: j ? j.name : h.judge_id, at: h.changed_at, kind: h.action === 'delete' ? '초기화로 지워진 값' : '바뀌기 전 값', items: h.items, absent: h.absent, memo: h.memo, total: tot(h), via: viaOf(null, h.changed_by, h.judge_id), atLabel: '바뀐 시각' }); });
  }
  judges().forEach(j => { const s = scoreOf(j.id, booth); if (!s) return;
    (Array.isArray(s.hist) ? s.hist : []).forEach(h => out.push({ judge: j.name, at: h.updatedAt, kind: '이전 제출', items: h.items, absent: h.absent, memo: h.memo, total: tot(h), via: viaOf(h.via, h.by, j.id) }));
    out.push({ judge: j.name, at: s.updatedAt, kind: '현재 점수', items: s.items, absent: s.absent, memo: s.memo, total: tot(s), via: viaOf(s.via, s.by, j.id), now: true });
  });
  return out.sort((a, b) => a.judge.localeCompare(b.judge) || String(a.at || '').localeCompare(String(b.at || '')));
}
async function historyCounts(){
  if (window.SB && SB.historyBooths){ try { return await SB.historyBooths(); } catch(e){ return null; } }
  const c = {}; Object.values(S.scores).forEach(s => { const n = Array.isArray(s.hist) ? s.hist.length : 0; if (n) c[s.booth] = (c[s.booth] || 0) + n; }); return c;
}
function bindHistory(){

    $('#histHint').textContent = n ? `점수가 바뀐 적 있는 팀 ${n}곳은 목록에 '수정 ○회'로 표시했습니다.` : '아직 점수가 바뀐 팀이 없습니다.';
    [...$('#histTeam').options].forEach(o => { const k = c[o.value] || c[String(parseInt(o.value, 10))]; if (k && !o.text.includes('수정 ')) o.text += ` · 수정 ${k}회`; }); });
  go.onclick = async () => { const booth = $('#histTeam').value; const out = $('#histOut'); out.innerHTML = '<p style="color:var(--muted)">불러오는 중…</p>';
    let rows; try { rows = await historyRows(booth); } catch(e){ out.innerHTML = `<p style="color:var(--bad)">이력을 불러오지 못했습니다: ${esc(e.message || e)}</p>`; return; }
    if (!rows.length){ out.innerHTML = '<p style="color:var(--muted)">이 팀은 아직 제출된 점수가 없습니다.</p>'; return; }
    out.innerHTML = `<div class="tablebox"><table><thead><tr><th>평가위원</th><th>구분</th><th>시각</th><th class="n">합계</th>${ITEMS.map((_, i) => `<th class="n">${i + 1}</th>`).join('')}<th>메모</th><th>입력</th></tr></thead><tbody>
      ${rows.map(r => `<tr${r.now ? ' style="font-weight:600"' : ''}><td>${esc(r.judge)}</td><td>${esc(r.kind)}</td><td class="num">${esc(r.at ? fmtTime(r.at) : '—')}</td><td class="n">${r.absent ? '미참여 ' : ''}${r.total}</td>${ITEMS.map((_, i) => `<td class="n">${r.absent ? '·' : esc((r.items || [])[i] ?? '')}</td>`).join('')}<td>${esc(r.memo || '')}</td><td>${esc(r.via || '')}</td></tr>`).join('')}
      </tbody></table></div><p style="margin:0;font-size:13px;color:var(--muted)">'바뀌기 전 값'의 시각은 그 값이 새 점수로 바뀐 시각입니다. 점수 초기화로 지운 점수는 웹 버전에서만 이력에 남습니다.</p>`;
  };

function gapSectionHtml(){

function gapSheet(){
  const head = ['학부','부스','학과','팀명','작품명','지도교수','위원 1','위원 1 총점','위원 2','위원 2 총점','점수 차',

  DIVS.forEach(div => { const {js, rows} = rowsFor(div); rows.slice().sort((a,b)=>(a.rank??999)-(b.rank??999)).forEach(r => { const aw = AW[r.t.booth];

  DIVS.forEach(div => { const q = quotaOf(div); quota.push([div, teamsOf(div).length, ...ALL_AWARDS.flatMap(a=>[q[a], teamsOf(div).filter(t=>AW[t.booth]&&AW[t.booth].award===a).length]), isManualTop()?'지정 모드':'자동 모드(대상 정원은 전체 1위 1팀)']); });
  const wb = XLSX.utils.book_new();

/* ---------- 심사표 PDF (2025학년도 서식 기준, 마감 후 출력) ---------- */
const SHEET_FONT = '"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const PW = 1240, PH = 1754; /* A4, 150dpi */
const AREA_LABELS = ['창의성 및\n기획성\n(30)', '기술성 및\n완성도\n(20)', '발표 및\n팀협력\n(30)', '기대효과\n(20)'];
function wrapLines(ctx, text, maxW){
  const out = [];
  String(text).split('\n').forEach(par => {
    let line = '';
    for (const w of par.split(/(?<=\s)/)){ /* 단어 단위로 줄바꿈, 한 단어가 너무 길면 글자 단위 */
      const t = line + w;
      if (ctx.measureText(t.trimEnd()).width <= maxW){ line = t; continue; }
      if (line.trim()){ out.push(line.trimEnd()); line = ''; }
      for (const ch of w){ const u = line + ch; if (ctx.measureText(u.trimEnd()).width > maxW && line){ out.push(line.trimEnd()); line = ch.trimStart(); } else line = u; }
    }
    out.push(line.trimEnd());
  });
  return out;
}
function textBlock(ctx, text, x, y, w, h, size, weight, align){
  let s = size, lines;
  do { ctx.font = `${weight} ${s}px ${SHEET_FONT}`; lines = wrapLines(ctx, text, w - 16); s -= 1; }
  while ((lines.length * s * 1.35 > h - 8) && s > 12);
  s += 1; const lh = s * 1.35; let ty = y + h/2 - (lines.length - 1) * lh / 2;
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  const tx = align === 'left' ? x + 12 : x + w/2;
  lines.forEach(l => { ctx.fillText(l, tx, ty); ty += lh; });
}
function sheetText(t, j, s){
  return [(evYear() + '학년도 캡스톤디자인 경진대회 심사표'), '작품명팀명학과항목주요심사내용배점평가점수매우우수보통점수계평가위원소속성명인전자제출미참여전항목자동처리명지전문대학산학융합지원센터온라인심사시스템출력',
    t.work||'', teamLabel(t), t.dept||'', j.name||'', j.org||'', ...ITEMS, ...AREA_LABELS, '0123456789():·~-./ '].join('');
}

  ctx.fillText(`소속 : ${j.org || ''}`, C[1] + 24, yJ + 40);
  ctx.fillText(`성명 : ${j.name || ''}   (인)`, 720, yJ + 40);
  ctx.font = `400 17px ${SHEET_FONT}`; ctx.fillStyle = '#555';
  ctx.fillText(s ? `전자 제출 ${fmtStamp(s.updatedAt)} · 본인 확인 체크 완료` : '미제출', 720, yJ + 72);

function fmtStamp(iso){ try { const d = new Date(iso); const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; } catch(e){ return ''; } }

async function buildPdf(pages, filename){
  if (!window.jspdf || !window.jspdf.jsPDF){ toast('PDF 도구를 불러오지 못했습니다'); return; }
  if (!S.downloads){ toast('이 화면에서는 파일을 받을 수 없습니다'); return; }
  if (!pages.length){ toast('출력할 제출 심사표가 없습니다'); return; }
  const canvas = document.createElement('canvas'); canvas.width = PW; canvas.height = PH; const ctx = canvas.getContext('2d');
  const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4', compress:true});
  const btns = document.querySelectorAll('[data-pdf]'); btns.forEach(b => b.disabled = true);
  const st = $('#pdfStatus');
  try {
    for (let k = 0; k < pages.length; k++){
      const {t, j, s} = pages[k];
      if (st) st.textContent = `만드는 중 ${k+1} / ${pages.length}`;
      await ensureFonts(sheetText(t, j, s));
      drawSheet(ctx, t, j, s);
      if (k) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, 210, 297);
      await new Promise(r => setTimeout(r, 0));
    }
    if (st) st.textContent = `${pages.length}장 완성`;
    await S.downloads.save({ filename, data: new Blob([pdf.output('arraybuffer')]) });
    toast(`${pages.length}장짜리 PDF를 저장했습니다`);
  } catch(e){ if (!(e && e.code === 'declined')) toast('PDF를 만들지 못했습니다'); }
  finally { btns.forEach(b => b.disabled = !DIVS.some(divLocked)); }
}
function pagesForJudge(jid){ const j = judge(jid); if (!j) return []; return teamsOf(j.division).map(t => ({t, j, s: scoreOf(j.id, t.booth)})).filter(p => p.s); }
function pagesForTeam(booth){ const t = S.teams[booth]; if (!t) return []; return judges().filter(j => j.division === t.division).map(j => ({t, j, s: scoreOf(j.id, booth)})).filter(p => p.s); }

/* ---------- 상장 출력 (2026 상장 양식, 모든 글자를 한 글꼴로 통일: 기본 나눔명조) ---------- */
const CERT_W = 1653, CERT_H = 2337, CERT_S = 200 / 72;   /* A4, 200dpi, 1pt = 2.78px */
const CERT_FONTS = { '나눔명조': '"Nanum Myeongjo",serif', '고운바탕': '"Gowun Batang",serif', '송명': '"Song Myung",serif' };
const CERT_ORDER = ['대상','금상','은상','동상','장려상'];
function certFamily(){ const v = ($('#certFont')||{}).value; return CERT_FONTS[v] || CERT_FONTS['나눔명조']; }
let certSealPromise = null;
function loadCertSeal(){
  if (!certSealPromise) certSealPromise = (async () => {
    /* Supabase: 비공개 저장소(private-assets/cert-seal.png)의 임시 주소를 그때그때 받아 옴(업로드 직후에도 새로 고침 없이 반영) */
    if (window.SB && SB.isAdmin && SB.client){
      const s = await SB.client.storage.from('private-assets').createSignedUrl('cert-seal.png', 60 * 60);
      if (!s.error && s.data) window.CERT_SEAL_URL = s.data.signedUrl;
    }
    return await new Promise((res, rej) => { const im = new Image();
      if (window.CERT_SEAL_URL) im.crossOrigin = 'anonymous';   /* 다른 주소의 이미지를 PDF(캔버스)에 쓰려면 필요 */
      im.onload = () => res(im); im.onerror = () => rej(new Error('seal'));
      im.src = window.CERT_SEAL_URL || 'cert-seal.png'; });
  })().catch(e => { certSealPromise = null; throw e; });
  return certSealPromise;
}
/* 전체 상장 목록: 상격 순 → 학부 순 → 학부 순위 → 팀원 순. 번호는 이 순서로 고정되어 필터와 관계없이 같은 학생은 같은 번호 */
function certAll(){
  const AW = computeAwards(); const rank = {};
  DIVS.forEach(div => rowsFor(div).rows.forEach(r => { rank[r.t.booth] = r.rank ?? 999; }));
  const teams = Object.values(S.teams).filter(t => AW[t.booth] && CERT_ORDER.includes(AW[t.booth].award));
  teams.sort((a,b) => CERT_ORDER.indexOf(AW[a.booth].award) - CERT_ORDER.indexOf(AW[b.booth].award)
    || DIVS.indexOf(a.division) - DIVS.indexOf(b.division) || rank[a.booth] - rank[b.booth] || a.booth.localeCompare(b.booth));
  const out = [];
  /* 상장 번호는 팀 단위: 같은 팀 학생은 같은 번호 (ti = 팀 순번) */
  teams.forEach((t, ti) => { const names = (Array.isArray(t.memberNames) && t.memberNames.length) ? t.memberNames : [teamLabel(t)];
    names.forEach(n => out.push({t, ti, award: AW[t.booth].award, name: n})); });
  return out;
}
function certNo(i){ const start = Math.max(1, parseInt(($('#certStart')||{}).value, 10) || 73); const pad = ($('#certPad')||{}).value === '0' ? 0 : 3; return String(start + i).padStart(pad, '0'); }
function certFilter(list){
  const aw = [...document.querySelectorAll('[data-certaw]')].filter(x => x.checked).map(x => x.value);
  const div = ($('#certDiv')||{}).value || ''; const booth = ($('#certTeam')||{}).value || '';
  return list.map(c => ({...c, no: certNo(c.ti)})).filter(c => aw.includes(c.award) && (!div || c.t.division === div) && (!booth || c.t.booth === booth));
}
/* 성명 표기: 팀원(팀명). 팀원 명단이 없으면 팀명만 */
function certPerson(c){ const team = teamLabel(c.t); return c.name && c.name !== team ? `${c.name}(${team})` : team; }
function certTitle(award){ const el = document.querySelector(`[data-certname="${award}"]`); return (el && el.value.trim()) || award; }
function drawCert(ctx, seal, c){
  const P = v => v * CERT_S, fam = certFamily();
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, CERT_W, CERT_H);
  ctx.fillStyle = '#000'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const font = (size, weight) => { ctx.font = `${weight || 700} ${P(size)}px ${fam}`; };
  /* 글자를 x0~x1 사이에 고르게 배치 (상장·총장 줄, 항목 이름, 본문 양쪽 맞춤) */
  const spread = (text, x0, x1, y) => { const ch = [...text]; const ws = ch.map(k => ctx.measureText(k).width); const sum = ws.reduce((a,b)=>a+b,0);
    const gap = ch.length > 1 ? (P(x1) - P(x0) - sum) / (ch.length - 1) : 0; let x = P(x0); ch.forEach((k, i) => { ctx.fillText(k, x, P(y)); x += ws[i] + gap; }); };
  font(15, 400); ctx.fillText(`제${evYear()}-${c.no}호`, P(112), P(99.7));
  font(36, 800); spread('상장', 225.6, 369.5 - 0, 160.0);
  font(30, 800); ctx.fillText(certTitle(c.award), P(86), P(225.9));
  /* 항목: 15pt 고정, 길면 다음 줄로 (줄 간격 18pt), 아래 항목은 그만큼 내려감 */
  const rows = [['작품명', c.t.work || ''], ['성명', certPerson(c)], ['학과', `${c.t.dept || ''}${c.t.advisor ? `(${c.t.advisor} 교수)` : ''}`]];
  if ((c.t.company || '').trim()) rows.push(['참여업체', c.t.company.trim()]);
  let y = 292.4;
  rows.forEach(([lab, val]) => {

async function buildCertPdf(){
  if (!allLocked()) return;
  if (!window.jspdf || !window.jspdf.jsPDF){ toast('PDF 도구를 불러오지 못했습니다'); return; }
  if (!S.downloads){ toast('이 화면에서는 파일을 받을 수 없습니다'); return; }
  const list = certFilter(certAll());
  if (!list.length){ toast('조건에 맞는 상장이 없습니다'); return; }
  const st = $('#certStatus'); const btns = document.querySelectorAll('[data-cert]'); btns.forEach(b => b.disabled = true);
  try {
    /* 직인 이미지가 없으면(Supabase Storage에 아직 안 올림) 직인 없이 출력 */
    const bg = await loadCertSeal().catch(() => { toast('직인 이미지를 찾지 못해 직인 없이 출력합니다'); return null; });
    if (document.fonts && document.fonts.load){ const txt = list.map(c => [c.t.work, c.name, c.t.dept, c.t.advisor, c.t.company, certTitle(c.award)].join('')).join('') + '제호상장작품명성학과참여업체:()교수0123456789-위학생은년도캡스톤디자인경진대회에서기와같은으로우수한적을거두었므로이수여합니다월일명지전문총';
      try { await Promise.all(['400','700','800'].map(w => document.fonts.load(`${w} 40px ${certFamily()}`, txt))); } catch(e){} }
    const canvas = document.createElement('canvas'); canvas.width = CERT_W; canvas.height = CERT_H; const ctx = canvas.getContext('2d');
    const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4', compress:true});
    for (let k = 0; k < list.length; k++){
      if (st) st.textContent = `만드는 중 ${k+1} / ${list.length}`;
      drawCert(ctx, bg, list[k]);
      if (k) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297);
      await new Promise(r => setTimeout(r, 0));
    }
    if (st) st.textContent = `${list.length}장 완성`;
    const tag = list.length === certAll().length ? '전체' : `${list.length}장`;
    await S.downloads.save({ filename: `${evYear()}_캡스톤디자인_상장_${tag}.pdf`, data: new Blob([pdf.output('arraybuffer')]) });
    toast(`상장 ${list.length}장을 저장했습니다`);
  } catch(e){ if (!(e && e.code === 'declined')) toast(e && e.message === 'bg' ? '상장 배경 이미지를 불러오지 못했습니다' : '상장 PDF를 만들지 못했습니다'); }
  finally { btns.forEach(b => b.disabled = !allLocked()); }
}
async function exportCertMerge(){

}

function bindCert(){
